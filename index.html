<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客戶紀錄 - 名單管理系統</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); margin-bottom: 1rem; }
        .badge-source { font-size: 0.75rem; }
        .table-hover tbody tr:hover { background-color: rgba(0,0,0,.025); }
        .cursor-pointer { cursor: pointer; }
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1080; }
        /* 隱藏 Netlify 底部工具列 */
        assets-badge, iframe[src*="netlify"], div[style*="z-index: 99999"] {
          display: none !important;
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-journal-text me-2"></i>客戶紀錄</span>
            <span class="text-white-50 small">名單管理系統</span>
        </div>
    </nav>

    <div class="container my-4">
        <!-- 統計與操作列 -->
        <div class="row align-items-center mb-3">
            <div class="col-auto">
                <span id="client-count" class="badge bg-primary fs-6 px-3 py-2">0 名單</span>
            </div>
            <div class="col text-end">
                <button class="btn btn-primary rounded-circle shadow" onclick="openClientModal()" style="width: 45px; height: 45px;" title="新增名單">
                    <i class="bi bi-plus-lg fs-5"></i>
                </button>
            </div>
        </div>

        <!-- 搜尋與篩選列 -->
        <div class="row g-2 mb-3">
            <div class="col-12 col-md-8">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input type="text" id="search-input" class="form-control" placeholder="搜尋姓名、電話、地址、身分證..." oninput="renderClients()">
                </div>
            </div>
            <div class="col-12 col-md-4">
                <select id="status-filter" class="form-select" onchange="renderClients()">
                    <option value="">所有狀態</option>
                    <option value="追蹤中">追蹤中</option>
                    <option value="已成交">已成交</option>
                    <option value="考慮中">考慮中</option>
                    <option value="未接/未聯繫">未接/未聯繫</option>
                </select>
            </div>
        </div>

        <!-- 今日壽星提醒區塊 -->
        <div id="birthday-alert-container"></div>

        <!-- 客戶列表容器 -->
        <div id="client-list">
            <div class="text-center py-5 text-muted">載入中，請檢查 API 網址...</div>
        </div>
    </div>

    <!-- 新增/編輯客戶 Modal -->
    <div class="modal fade" id="client-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="client-modal-title">新增客戶</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="client-form">
                        <input type="hidden" id="client-id">
                        <div class="mb-3">
                            <label class="form-label">姓名 <span class="text-danger">*</span></label>
                            <input type="text" id="client-name" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">性別</label>
                                <select id="client-gender" class="form-select">
                                    <option value="男">男</option>
                                    <option value="女">女</option>
                                </select>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">生日</label>
                                <input type="date" id="client-birthday" class="form-control" onchange="calcInsuranceAge()">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">保險年齡預測</label>
                            <input type="text" id="client-insurance-age" class="form-control bg-light" readonly placeholder="選擇生日後自動計算">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">名單來源</label>
                                <select id="client-source-type" class="form-select" onchange="toggleSourceDetail()">
                                    <option value="綠故">綠故</option>
                                    <option value="介紹">介紹</option>
                                    <option value="陌生">陌生</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div class="col-6 mb-3" id="source-detail-container" style="display:none;">
                                <label class="form-label" id="source-detail-label">介紹人</label>
                                <input type="text" id="client-source-val" class="form-control" placeholder="請輸入姓名">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">身分證字號</label>
                            <input type="text" id="client-idnumber" class="form-control text-uppercase" placeholder="例如: A123456789">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">電話</label>
                            <input type="tel" id="client-phone" class="form-control" placeholder="0912345678">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">地址</label>
                            <input type="text" id="client-address" class="form-control" placeholder="縣市區街道...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">現有車輛（可多選）</label>
                            <div class="d-flex gap-3">
                                <div class="form-check"><input class="form-check-input vehicle-chk" type="checkbox" value="汽車" id="veh-car"><label class="form-check-label" for="veh-car">汽車</label></div>
                                <div class="form-check"><input class="form-check-input vehicle-chk" type="checkbox" value="機車" id="veh-moto"><label class="form-check-label" for="veh-moto">機車</label></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">狀態</label>
                            <select id="client-status" class="form-select">
                                <option value="追蹤中">追蹤中</option>
                                <option value="已成交">已成交</option>
                                <option value="考慮中">考慮中</option>
                                <option value="未接/未聯繫">未接/未聯繫</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">備註</label>
                            <textarea id="client-notes" class="form-control" rows="2" placeholder="家庭狀況、喜好等..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveClient()">儲存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 訪談紀錄 Modal -->
    <div class="modal fade" id="interview-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">訪談與互動紀錄 - <span id="int-client-name"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="int-client-id">
                    <form id="interview-form" class="bg-light p-3 rounded mb-3">
                        <h6 class="text-primary mb-2">新增紀錄</h6>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label small">時間</label>
                                <input type="datetime-local" id="int-date" class="form-control form-control-sm">
                            </div>
                            <div class="col-6">
                                <label class="form-label small">類型</label>
                                <select id="int-type" class="form-select form-control-sm">
                                    <option value="面談">面談</option>
                                    <option value="電話">電話</option>
                                    <option value="Line/訊息">Line/訊息</option>
                                    <option value="生日祝賀">生日祝賀</option>
                                    <option value="理賠服務">理賠服務</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">內容摘要</label>
                            <textarea id="int-content" class="form-control form-control-sm" rows="2" placeholder="談話重點、保險需求等..."></textarea>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">下次預定聯絡日</label>
                            <input type="date" id="int-nextdate" class="form-control form-control-sm">
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-sm btn-primary" onclick="saveInterview()"><i class="bi bi-plus-lg"></i> 新增紀錄</button>
                        </div>
                    </form>

                    <hr>
                    <h6 class="text-secondary mb-2">歷史紀錄</h6>
                    <div id="interview-history-list" style="max-height: 250px; overflow-y: auto;">
                        <!-- 動態載入歷史紀錄 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 訊息提示 Toast -->
    <div class="toast-container">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div id="toast-body" class="toast-body">操作成功！</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxik28XYTitdvmd1XFjJxWu1aCzU7-bOSSjVNHBlmpu3kxYLWrMTgeoIPSjhc1ACtpz/exec";
        let allClients = [];
        let allInterviews = [];
        let clientModal = null;
        let interviewModal = null;

        document.addEventListener("DOMContentLoaded", () => {
            clientModal = new bootstrap.Modal(document.getElementById('client-modal'));
            interviewModal = new bootstrap.Modal(document.getElementById('interview-modal'));
            fetchData();
        });

        function showToast(message, isError = false) {
            const toastEl = document.getElementById('liveToast');
            toastEl.className = `toast align-items-center text-white bg-${isError ? 'danger' : 'success'} border-0`;
            document.getElementById('toast-body').innerText = message;
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }

        function fetchData() {
            document.getElementById('client-list').innerHTML = '<div class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm me-2"></div>資料載入中...</div>';
            
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        allClients = data.clients || [];
                        allInterviews = data.interviews || [];
                        checkBirthdays();
                        renderClients();
                    } else {
                        throw new Error(data.message || '未知錯誤');
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('client-list').innerHTML = `
                        <div class="alert alert-danger text-center my-3">
                            <i class="bi bi-exclamation-triangle-fill fs-4 d-block mb-2"></i>
                            載入失敗，請檢查 API 網址或網路連線
                            <div class="small text-muted mt-1">錯誤原因: ${err.message}</div>
                            <button class="btn btn-outline-danger btn-sm mt-3" onclick="fetchData()">重新載入</button>
                        </div>`;
                });
        }

        function checkBirthdays() {
            const today = new Date();
            const todayStr = `${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            
            const birthdayClients = allClients.filter(c => {
                if (!c.birthday) return false;
                const parts = c.birthday.split('-');
                if (parts.length < 3) return false;
                return `${parts[1]}-${parts[2]}` === todayStr;
            });

            const container = document.getElementById('birthday-alert-container');
            if (birthdayClients.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            birthdayClients.forEach(c => {
                html += `
                    <div class="alert alert-warning d-flex align-items-center shadow-sm mb-2" role="alert">
                        <i class="bi bi-cake2-fill fs-4 me-3 text-warning"></i>
                        <div class="flex-grow-1">
                            <strong>今日壽星 (${c.birthday})：</strong> 
                            <span class="badge bg-dark ms-1">${c.name}</span> 
                            記得送上祝賀！
                        </div>
                        ${c.phone ? `<a href="tel:${c.phone}" class="btn btn-sm btn-dark me-2"><i class="bi bi-telephone-fill"></i> 打電話</a>` : ''}
                        <button class="btn btn-sm btn-outline-dark" onclick="openInterviewModal('${c.id}')"><i class="bi bi-chat-heart"></i> 寫紀錄</button>
                    </div>`;
            });
            container.innerHTML = html;
        }

        function renderClients() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;

            const filtered = allClients.filter(c => {
                const matchKeyword = !keyword || 
                    (c.name && c.name.toLowerCase().includes(keyword)) ||
                    (c.phone && c.phone.includes(keyword)) ||
                    (c.address && c.address.toLowerCase().includes(keyword)) ||
                    (c.idNumber && c.idNumber.toLowerCase().includes(keyword));
                
                const matchStatus = !statusFilter || c.status === statusFilter;
                return matchKeyword && matchStatus;
            });

            document.getElementById('client-count').innerText = `${filtered.length} 名單`;

            const listEl = document.getElementById('client-list');
            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="text-center py-5 text-muted bg-white rounded shadow-sm">沒有找到符合的客戶資料</div>';
                return;
            }

            let html = '';
            filtered.forEach(c => {
                // 計算保險年齡
                let insAgeText = '未填生日';
                if (c.birthday) {
                    const bDate = new Date(c.birthday);
                    const now = new Date();
                    let diffYears = now.getFullYear() - bDate.getFullYear();
                    const bThisYear = new Date(now.getFullYear(), bDate.getMonth(), bDate.getDate());
                    if (now < bThisYear) diffYears--;
                    
                    const nextBday = new Date(now.getFullYear(), bDate.getMonth(), bDate.getDate());
                    if (now > nextBday) nextBday.setFullYear(now.getFullYear() + 1);
                    const diffDays = Math.ceil((nextBday - now) / (1000 * 60 * 60 * 24));
                    
                    let insAge = diffYears;
                    if (diffDays <= 183) insAge += 1;
                    insAgeText = `保險年齡 ${insAge}歲 (再過${diffDays}天+1)`;
                }

                // 來源標籤
                let sourceBadge = '';
                if (c.source) {
                    let text = c.source.type || '';
                    if (c.source.referrerName) text += `: ${c.source.referrerName}`;
                    else if (c.source.text) text += `: ${c.source.text}`;
                    sourceBadge = `<span class="badge bg-secondary badge-source me-1">來源：${text}</span>`;
                }

                // 狀態顏色
                let statusColor = 'secondary';
                if (c.status === '已成交') statusColor = 'success';
                else if (c.status === '追蹤中') statusColor = 'primary';
                else if (c.status === '考慮中') statusColor = 'warning text-dark';
                else if (c.status === '未接/未聯繫') statusColor = 'danger';

                // 車輛標籤
                let vehHtml = '';
                if (Array.isArray(c.vehicles)) {
                    c.vehicles.forEach(v => {
                        vehHtml += `<span class="badge bg-light text-dark border me-1"><i class="bi bi-car-front"></i> ${v}</span>`;
                    });
                }

                // 訪談次數
                const intCount = allInterviews.filter(i => String(i.clientId) === String(c.id)).length;

                html += `
                    <div class="card shadow-sm mb-3">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h5 class="card-title mb-1 d-inline-block fw-bold">${c.name}</h5>
                                    <span class="badge bg-${c.gender === '男' ? 'info' : 'danger'} ms-2">${c.gender}</span>
                                    <span class="badge bg-${statusColor} ms-1">${c.status || '追蹤中'}</span>
                                </div>
                                <div>
                                    <button class="btn btn-sm btn-outline-secondary me-1" onclick="openClientModal('${c.id}')" title="編輯"><i class="bi bi-pencil"></i></button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteClient('${c.id}', '${c.name}')" title="刪除"><i class="bi bi-trash"></i></button>
                                </div>
                            </div>
                            
                            <div class="d-flex flex-wrap gap-2 mb-2">
                                <span class="badge bg-light text-primary border"><i class="bi bi-shield-check"></i> ${insAgeText}</span>
                                <button class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size: 0.8rem;" onclick="openInterviewModal('${c.id}')">
                                    <i class="bi bi-chat-text"></i> 訪談紀錄 (${intCount})
                                </button>
                            </div>

                            <div class="mb-2">${sourceBadge} ${vehHtml}</div>

                            <div class="row text-muted small g-1 border-top pt-2">
                                <div class="col-12 col-md-4"><i class="bi bi-calendar-event me-1"></i> 生日：${c.birthday || '未填寫'}</div>
                                <div class="col-12 col-md-4"><i class="bi bi-person-badge me-1"></i> 身分證：${c.idNumber || '未填寫'}</div>
                                <div class="col-12 col-md-4"><i class="bi bi-telephone me-1"></i> 電話：${c.phone ? `<a href="tel:${c.phone}">${c.phone}</a>` : '未填寫'}</div>
                                <div class="col-12"><i class="bi bi-geo-alt me-1"></i> 地址：${c.address || '未填寫'}</div>
                                ${c.notes ? `<div class="col-12 text-dark mt-1 bg-light p-2 rounded"><i class="bi bi-sticky me-1"></i> 備註：${c.notes}</div>` : ''}
                            </div>
                        </div>
                    </div>`;
            });
            listEl.innerHTML = html;
        }

        function formatPhone(phone) {
            if (!phone) return '';
            let p = String(phone).trim();
            if (p.length === 9 && p.startsWith('9')) {
                p = '0' + p;
            }
            return p;
        }

        function openClientModal(id = null) {
            document.getElementById('client-form').reset();
            document.getElementById('client-id').value = '';
            document.querySelectorAll('.vehicle-chk').forEach(el => el.checked = false);
            
            if (id) {
                document.getElementById('client-modal-title').innerText = '編輯客戶';
                const c = allClients.find(item => String(item.id) === String(id));
                if (c) {
                    document.getElementById('client-id').value = c.id;
                    document.getElementById('client-name').value = c.name || '';
                    document.getElementById('client-gender').value = c.gender || '男';
                    document.getElementById('client-birthday').value = c.birthday || '';
                    document.getElementById('client-idnumber').value = c.idNumber || '';
                    document.getElementById('client-phone').value = c.phone || '';
                    document.getElementById('client-address').value = c.address || '';
                    document.getElementById('client-status').value = c.status || '追蹤中';
                    document.getElementById('client-notes').value = c.notes || '';

                    if (c.source) {
                        document.getElementById('client-source-type').value = c.source.type || '綠故';
                        toggleSourceDetail();
                        if (c.source.type === '介紹') {
                            document.getElementById('client-source-val').value = c.source.referrerName || '';
                        } else if (c.source.type === '其他') {
                            document.getElementById('client-source-val').value = c.source.text || '';
                        }
                    }

                    if (Array.isArray(c.vehicles)) {
                        document.querySelectorAll('.vehicle-chk').forEach(el => {
                            if (c.vehicles.includes(el.value)) el.checked = true;
                        });
                    }
                    calcInsuranceAge();
                }
            } else {
                document.getElementById('client-modal-title').innerText = '新增客戶';
                document.getElementById('client-id').value = 'c_' + Date.now();
                toggleSourceDetail();
                document.getElementById('client-insurance-age').value = '';
            }
            clientModal.show();
        }

        function toggleSourceDetail() {
            const type = document.getElementById('client-source-type').value;
            const container = document.getElementById('source-detail-container');
            const label = document.getElementById('source-detail-label');
            const input = document.getElementById('client-source-val');

            if (type === '介紹') {
                container.style.display = 'block';
                label.innerText = '介紹人姓名';
                input.placeholder = '請輸入介紹人';
            } else if (type === '其他') {
                container.style.display = 'block';
                label.innerText = '其他說明';
                input.placeholder = '請輸入來源說明';
            } else {
                container.style.display = 'none';
                input.value = '';
            }
        }

        function calcInsuranceAge() {
            const bVal = document.getElementById('client-birthday').value;
            if (!bVal) {
                document.getElementById('client-insurance-age').value = '';
                return;
            }
            const bDate = new Date(bVal);
            const now = new Date();
            let diffYears = now.getFullYear() - bDate.getFullYear();
            const bThisYear = new Date(now.getFullYear(), bDate.getMonth(), bDate.getDate());
            if (now < bThisYear) diffYears--;
            
            const nextBday = new Date(now.getFullYear(), bDate.getMonth(), bDate.getDate());
            if (now > nextBday) nextBday.setFullYear(now.getFullYear() + 1);
            const diffDays = Math.ceil((nextBday - now) / (1000 * 60 * 60 * 24));
            
            let insAge = diffYears;
            if (diffDays <= 183) insAge += 1;
            document.getElementById('client-insurance-age').value = `保險年齡 ${insAge} 歲 (再過 ${diffDays} 天滿期)`;
        }

        function saveClient() {
            const name = document.getElementById('client-name').value.trim();
            if (!name) {
                alert('請輸入姓名');
                return;
            }

            const sourceType = document.getElementById('client-source-type').value;
            const sourceVal = document.getElementById('client-source-val').value.trim();
            let sourceObj = { type: sourceType, referrerName: "", text: "" };
            if (sourceType === '介紹') sourceObj.referrerName = sourceVal;
            if (sourceType === '其他') sourceObj.text = sourceVal;

            let vehicles = [];
            document.querySelectorAll('.vehicle-chk').forEach(el => {
                if (el.checked) vehicles.push(el.value);
            });

            const client = {
                id: document.getElementById('client-id').value,
                name: name,
                gender: document.getElementById('client-gender').value,
                birthday: document.getElementById('client-birthday').value,
                source: sourceObj,
                idNumber: document.getElementById('client-idnumber').value.trim().toUpperCase(),
                phone: formatPhone(document.getElementById('client-phone').value),
                address: document.getElementById('client-address').value.trim(),
                vehicles: vehicles,
                status: document.getElementById('client-status').value,
                notes: document.getElementById('client-notes').value.trim()
            };

            clientModal.hide();
            showToast('儲存中...');

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'saveClient', client: client })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showToast('儲存成功！');
                    fetchData();
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(err => {
                alert('儲存失敗: ' + err.message);
            });
        }

        function deleteClient(id, name) {
            if (!confirm(`確定要刪除客戶「${name}」以及相關的所有訪談紀錄嗎？`)) return;
            showToast('刪除中...');

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'deleteClient', clientId: id })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showToast('已刪除');
                    fetchData();
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(err => {
                alert('刪除失敗: ' + err.message);
            });
        }

        function openInterviewModal(clientId) {
            const c = allClients.find(item => String(item.id) === String(clientId));
            if (!c) return;

            document.getElementById('int-client-id').value = c.id;
            document.getElementById('int-client-name').innerText = c.name;
            document.getElementById('int-form').reset();

            // 預設帶入目前時間
            const now = new Date();
            const tzOffset = now.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(now - tzOffset)).toISOString().slice(0, 16);
            document.getElementById('int-date').value = localISOTime;

            renderInterviewHistory(c.id);
            interviewModal.show();
        }

        function renderInterviewHistory(clientId) {
            const historyList = allInterviews.filter(i => String(i.clientId) === String(clientId));
            historyList.sort((a, b) => new Date(b.date || b.createdAt) - new Date(a.date || a.createdAt));

            const container = document.getElementById('interview-history-list');
            if (historyList.length === 0) {
                container.innerHTML = '<div class="text-muted small text-center py-3">尚無訪談紀錄</div>';
                return;
            }

            let html = '';
            historyList.forEach(item => {
                html => ''
                html += `
                    <div class="border-bottom pb-2 mb-2 position-relative">
                        <div class="d-flex justify-content-between text-muted" style="font-size: 0.75rem;">
                            <span><i class="bi bi-clock"></i> ${item.date || item.createdAt} | <span class="badge bg-secondary">${item.type}</span></span>
                            <button class="btn btn-link text-danger p-0 text-decoration-none" style="font-size: 0.75rem;" onclick="deleteInterview('${item.id}', '${clientId}')">刪除</button>
                        </div>
                        <div class="small mt-1 text-dark" style="white-space: pre-wrap;">${item.content}</div>
                        ${item.nextDate ? `<div class="text-primary mt-1" style="font-size: 0.75rem;"><i class="bi bi-alarm"></i> 下次聯絡：${item.nextDate}</div>` : ''}
                    </div>`;
            });
            container.innerHTML = html;
        }

        function saveInterview() {
            const clientId = document.getElementById('int-client-id').value;
            const content = document.getElementById('int-content').value.trim();
            if (!content) {
                alert('請輸入訪談內容');
                return;
            }

            const interview = {
                id: 'int_' + Date.now(),
                clientId: clientId,
                date: document.getElementById('int-date').value,
                type: document.getElementById('int-type').value,
                content: content,
                nextDate: document.getElementById('int-nextdate').value
            };

            showToast('儲存紀錄中...');

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'saveInterview', interview: interview })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showToast('紀錄已新增');
                    // 本地暫存新增
                    allInterviews.push(interview);
                    document.getElementById('int-content').value = '';
                    document.getElementById('int-nextdate').value = '';
                    renderInterviewHistory(clientId);
                    // 同步背景更新主畫面
                    fetch(API_URL).then(res => res.json()).then(d => { if(d.status==='success') allInterviews = d.interviews || []; });
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(err => {
                alert('儲存失敗: ' + err.message);
            });
        }

        function deleteInterview(interviewId, clientId) {
            if (!confirm('確定要刪除這筆訪談紀錄嗎？')) return;
            showToast('刪除中...');

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'deleteInterview', interviewId: interviewId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showToast('已刪除');
                    allInterviews = allInterviews.filter(i => String(i.id) !== String(interviewId));
                    renderInterviewHistory(clientId);
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(err => {
                alert('刪除失敗: ' + err.message);
            });
        }
    </script>
</body>
</html>
