<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客戶紀錄 - 名單管理系統</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<style>
.reminder-box{border:1px solid;border-radius:1rem;padding:1rem;margin-bottom:1rem;box-shadow:0 .125rem .25rem rgba(0,0,0,.075)}
.reminder-birthday{background:#fff3cd;border-color:#ffca2c;color:#493600}.reminder-expired{background:#fce8e8;border-color:#e79a9a;color:#8e2018}.reminder-upcoming{background:#e7f3ff;border-color:#8cb9f2;color:#173b68}
.reminder-heading{display:flex;align-items:center;gap:.5rem;font-weight:700;margin-bottom:.75rem}.reminder-item{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.5rem 0}.reminder-item+.reminder-item{border-top:1px solid rgba(0,0,0,.1)}.reminder-name{flex-shrink:0;font-size:.875rem;font-weight:700;padding:.15rem .55rem}.reminder-detail{text-align:right;font-size:.875rem;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.reminder-birthday .reminder-detail{color:#6b5300}.reminder-expired .reminder-detail{color:#b42318}.reminder-upcoming .reminder-detail{color:#345879}
#client-gender{font-size:12px;padding-left:6px;padding-right:20px;background-position:right 4px center;min-width:0}
.main-tabs{display:flex;gap:.5rem;margin-bottom:1rem}.main-tabs .btn{flex:1}.stat-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin-bottom:1rem}.stat-metric{border:1px solid #e4e9f0;background:white;border-radius:1rem;padding:1rem .65rem;box-shadow:0 .125rem .25rem rgba(0,0,0,.05);text-align:center;cursor:pointer}.stat-metric:focus-visible,.stat-clickable:focus-visible{outline:3px solid #86b7fe;outline-offset:2px}.stat-metric .number{font-size:1.7rem;font-weight:750;color:#0d6efd;font-variant-numeric:tabular-nums}.stat-metric .label{font-size:.85rem;color:#495057}.stat-subtabs{position:sticky;top:0;z-index:10;background:#fff;padding:.6rem 0;border-bottom:1px solid #dee2e6;display:flex;gap:.3rem}.stat-subtabs .btn{flex:1;font-size:.85rem;padding:.5rem .2rem}.stat-panel{padding:1rem 0 2rem}.stat-card{border:1px solid #e7eaf0;border-radius:1rem;background:#fff;padding:1rem;margin-bottom:1rem;box-shadow:0 .125rem .25rem rgba(0,0,0,.04)}.stat-clickable{cursor:pointer}.stat-row{display:flex;align-items:center;gap:.6rem;padding:.55rem .2rem;border-bottom:1px solid #f1f3f5}.stat-row:last-child{border-bottom:0}.stat-row .stat-label{width:76px;flex-shrink:0;font-size:.83rem}.stat-track{flex:1;height:13px;background:#e9ecef;border-radius:1rem;overflow:hidden}.stat-fill{height:100%;background:#0d6efd;border-radius:1rem}.stat-value{display:grid;grid-template-columns:36px 58px;gap:.3rem;text-align:right;font-size:.78rem;font-variant-numeric:tabular-nums;flex:none}.stat-value span{text-align:right;white-space:nowrap}@media(max-width:390px){.stat-value{grid-template-columns:27px 48px;gap:.2rem;font-size:.72rem}}.stat-donut{width:176px;height:176px;flex:none;border-radius:50%;position:relative;margin:auto}.stat-donut:after{content:'';position:absolute;inset:38px;border-radius:50%;background:white}.stat-legend{flex:1;min-width:0}.stat-legend button{width:100%;display:flex;align-items:center;gap:.5rem;border:0;background:none;text-align:left;padding:.5rem .2rem;border-radius:.4rem}.stat-legend button:hover,.stat-row.stat-clickable:hover{background:#f5f8ff}.stat-dot{width:12px;height:12px;flex:none;border-radius:50%}.stat-legend .stat-amount{margin-left:auto;font-size:.85rem;white-space:nowrap}.stat-legend .stat-legend-heading{display:grid;grid-template-columns:minmax(60px,1fr) 52px 65px;gap:.35rem;padding:.1rem .2rem .35rem 1.45rem;font-size:.75rem;color:#6c757d}.stat-legend .stat-legend-heading span:nth-child(n+2){text-align:right}.stat-legend .stat-legend-item{display:grid;grid-template-columns:12px minmax(60px,1fr) 52px 65px;gap:.35rem;align-items:center}.stat-legend .stat-legend-name{min-width:0}.stat-legend .stat-legend-count,.stat-legend .stat-legend-percent{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.85rem}@media(max-width:390px){.stat-legend .stat-legend-heading{grid-template-columns:minmax(45px,1fr) 35px 55px;gap:.2rem}.stat-legend .stat-legend-item{grid-template-columns:12px minmax(45px,1fr) 35px 55px;gap:.2rem}.stat-legend .stat-legend-count,.stat-legend .stat-legend-percent{font-size:.78rem}}.stat-filter-banner{border:1px solid #b6d4fe;background:#e7f1ff;color:#084298;border-radius:.75rem;padding:.7rem .8rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}.stat-filter-banner span{overflow-wrap:anywhere}.stats-empty{color:#6c757d;text-align:center;padding:2rem .5rem}.stats-notice{font-size:.84rem;color:#6c757d;line-height:1.6}
/* V1.5.3：手機統計圓餅圖響應式修正；僅調整版面，不影響統計與篩選 */
@media (max-width: 575.98px) {
  .stat-card { min-width: 0; }
  .stat-card > .d-flex:has(> .stat-donut) {
    flex-direction: column;
    align-items: stretch !important;
    gap: 1rem !important;
  }
  .stat-card .stat-donut { align-self: center; }
  .stat-card .stat-legend { width: 100%; min-width: 0; flex: none; }
  .stat-card .stat-legend .stat-legend-heading {
    grid-template-columns: minmax(0, 1fr) 3.5rem 4.5rem;
    gap: .35rem;
    padding-left: 1.45rem;
  }
  .stat-card .stat-legend .stat-legend-item {
    grid-template-columns: 12px minmax(0, 1fr) 3.5rem 4.5rem;
    gap: .35rem;
    min-width: 0;
  }
  .stat-card .stat-legend .stat-legend-name { overflow-wrap: anywhere; }
  .stat-card .stat-legend .stat-legend-count,
  .stat-card .stat-legend .stat-legend-percent { font-size: .85rem; }
}
@media (max-width: 390px) {
  .stat-card .stat-legend .stat-legend-heading {
    grid-template-columns: minmax(0, 1fr) 2.5rem 4rem;
    gap: .2rem;
  }
  .stat-card .stat-legend .stat-legend-item {
    grid-template-columns: 12px minmax(0, 1fr) 2.5rem 4rem;
    gap: .2rem;
  }
}
/* V1.6.0：四個統計頁籤與年收入橫條圖的窄螢幕排版 */
.stat-subtabs .btn{min-width:0;font-size:.78rem}
.stat-income-row .stat-label{width:90px;overflow-wrap:anywhere}
@media(max-width:390px){.stat-income-row{gap:.35rem}.stat-income-row .stat-label{width:74px;font-size:.73rem}.stat-income-row .stat-value{grid-template-columns:23px 43px;font-size:.7rem}}
/* V1.7.0：分析對象與直向統計 */
.analysis-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}.analysis-options .btn{display:flex;justify-content:space-between;align-items:center;gap:.3rem;font-size:.85rem;padding:.65rem .55rem;min-width:0}.analysis-options .btn span:last-child{font-variant-numeric:tabular-nums;font-weight:700}
/* V1.7.1：分析對象按鈕顏色僅依實際選取狀態，避免觸控 hover 殘留 */
.analysis-options .btn[aria-pressed="false"]{color:#0d6efd;background-color:#fff;border-color:#0d6efd}
.analysis-options .btn[aria-pressed="true"]{color:#fff;background-color:#0d6efd;border-color:#0d6efd}
.analysis-options .btn:focus-visible{outline:3px solid #86b7fe;outline-offset:2px}
</style>
</head>
<body>
<div class="container py-4" style="max-width:600px">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div><h3 class="fw-bold mb-0 text-dark">客戶紀錄</h3><small class="text-muted">名單管理系統</small></div>
    <div class="d-flex align-items-center gap-2"><span class="badge bg-primary px-3 py-2 fs-6" id="client-count">0 名單</span><button class="btn btn-primary rounded-circle shadow-sm d-flex align-items-center justify-content-center" style="width:40px;height:40px" onclick="openModalForAdd()" aria-label="新增名單"><i class="bi bi-plus-lg fs-5"></i></button></div>
  </div>
  <div class="main-tabs"><button id="main-tab-list" class="btn btn-primary fw-bold" onclick="switchMainTab('list')"><i class="bi bi-people-fill me-1"></i>總覽</button><button id="main-tab-stats" class="btn btn-outline-primary fw-bold" onclick="switchMainTab('stats')"><i class="bi bi-bar-chart-fill me-1"></i>統計分析</button></div>
  <section id="list-view">
    <div id="stats-filter-banner" class="stat-filter-banner" style="display:none"><span id="stats-filter-label"></span><button class="btn btn-sm btn-outline-primary bg-white flex-shrink-0" onclick="clearStatsFilter()">清除</button></div>
    <div class="row g-2 mb-3"><div class="col-7"><div class="input-group shadow-sm"><span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span><input type="text" class="form-control border-start-0 ps-0" id="search-input" placeholder="搜尋姓名、電話、地址、身分證..." oninput="onManualFilterChange()"></div></div><div class="col-5"><select class="form-select shadow-sm" id="month-select" onchange="onManualFilterChange()">
      <option value="">所有名單</option><optgroup label="排序方式"><option value="sort-age-desc">年紀</option><option value="sort-ins-asc">距離保險年齡+1</option></optgroup><optgroup label="每月壽星"><option value="01">1月壽星</option><option value="02">2月壽星</option><option value="03">3月壽星</option><option value="04">4月壽星</option><option value="05">5月壽星</option><option value="06">6月壽星</option><option value="07">7月壽星</option><option value="08">8月壽星</option><option value="09">9月壽星</option><option value="10">10月壽星</option><option value="11">11月壽星</option><option value="12">12月壽星</option></optgroup><optgroup label="強制險到期月份"><option value="ins-01">1月</option><option value="ins-02">2月</option><option value="ins-03">3月</option><option value="ins-04">4月</option><option value="ins-05">5月</option><option value="ins-06">6月</option><option value="ins-07">7月</option><option value="ins-08">8月</option><option value="ins-09">9月</option><option value="ins-10">10月</option><option value="ins-11">11月</option><option value="ins-12">12月</option></optgroup>
    </select></div></div>
    <div id="today-birthday-banner" class="reminder-box reminder-birthday" style="display:none"><div class="reminder-heading"><i class="bi bi-cake2-fill"></i><span id="today-birthday-title">本日壽星</span></div><div id="today-birthday-content"></div></div>
    <div id="expired-insurance-banner" class="reminder-box reminder-expired" style="display:none"><div class="reminder-heading"><i class="bi bi-exclamation-triangle-fill"></i><span id="expired-insurance-title">車險已過期</span></div><div id="expired-insurance-content"></div></div>
    <div id="upcoming-insurance-banner" class="reminder-box reminder-upcoming" style="display:none"><div class="reminder-heading"><i class="bi bi-car-front-fill"></i><span id="upcoming-insurance-title">近兩個月車險即將到期</span></div><div id="upcoming-insurance-content"></div></div>
    <div id="client-list"></div>
  </section>
  <section id="stats-view" style="display:none">
    <div class="stat-metrics" id="stat-metrics"></div>
    <div class="stat-card"><h6 class="fw-bold mb-3">分析對象</h6><div id="analysis-options" class="analysis-options"></div><p id="analysis-summary" class="stats-notice mt-3 mb-0" aria-live="polite"></p></div>
    <div id="stats-composition"></div><div id="stats-source"></div><div id="stats-age"></div><div id="stats-income"></div>
  </section>
</div>
<div class="modal fade" id="client-modal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable"><div class="modal-content rounded-4 border-0 shadow"><div class="modal-header bg-light"><h5 class="modal-title fw-bold" id="modal-title">新增名單</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-4">
  <input type="hidden" id="client-id"><div class="mb-3"><label class="form-label small fw-bold">姓名 *</label><input type="text" class="form-control" id="client-name"></div>
  <div class="row g-2 mb-3"><div class="col-3"><label class="form-label small fw-bold">性別 *</label><select class="form-select form-select-sm" id="client-gender"><option value="">請選擇</option><option value="男">男</option><option value="女">女</option></select></div><div class="col-9"><label class="form-label small fw-bold">生日 *</label><div class="d-flex gap-1"><select class="form-select form-select-sm" id="birthday-year" aria-label="生日年份" style="min-width:0;flex:2.5" onchange="updateBirthdayMonths()"><option value="">年</option></select><select class="form-select form-select-sm" id="birthday-month" aria-label="生日月份" style="min-width:0;flex:1" onchange="updateBirthdayDays()"><option value="">月</option></select><select class="form-select form-select-sm" id="birthday-day" aria-label="生日日期" style="min-width:0;flex:1"><option value="">日</option></select></div><input type="hidden" id="client-birthday"></div></div>
  <div class="mb-3"><label class="form-label small fw-bold">來源</label><div class="row g-2 align-items-center"><div class="col-4" id="source-type-col"><select class="form-select form-select-sm" id="client-source-type" onchange="onSourceTypeChange()"><option value="緣故">緣故</option><option value="轉介紹">轉介紹</option><option value="陌生">陌生</option></select></div><div class="col-4" id="source-referrer-col" style="display:none;position:relative"><input type="text" class="form-control form-control-sm" id="client-source-referrer" placeholder="轉介紹中心" oninput="onReferrerInput(this.value)" autocomplete="off"><div id="referrer-dropdown" class="dropdown-menu shadow w-100 p-0" style="max-height:150px;overflow-y:auto;display:none;position:absolute;z-index:1050"></div></div><div class="col-8" id="source-text-col"><input type="text" class="form-control form-control-sm" id="client-source-text"></div></div></div>
  <div class="mb-3"><label class="form-label small fw-bold">身分證字號</label><input type="text" class="form-control" id="client-idNumber" autocapitalize="characters" spellcheck="false" oninput="clearIdNumberError()"><div class="invalid-feedback" id="id-number-error"></div></div>
  <div class="mb-3"><label class="form-label small fw-bold">職業</label><input type="text" class="form-control" id="client-occupation"></div><div class="mb-3"><label class="form-label small fw-bold">年收入（萬元）</label><input type="number" min="0" step="any" class="form-control" id="client-annualIncome"></div><div class="mb-3"><label class="form-label small fw-bold">電話</label><input type="tel" class="form-control" id="client-phone"></div><div class="mb-3"><label class="form-label small fw-bold">地址</label><input type="text" class="form-control" id="client-address"></div>
  <div class="mb-3"><label class="form-label small fw-bold">既有客戶</label><div class="d-flex flex-wrap gap-2"><div class="form-check"><input class="form-check-input client-tag-checkbox" type="checkbox" value="人壽" id="tag-life"><label class="form-check-label" for="tag-life">人壽</label></div><div class="form-check"><input class="form-check-input client-tag-checkbox" type="checkbox" value="車險" id="tag-car"><label class="form-check-label" for="tag-car">車險</label></div><div class="form-check"><input class="form-check-input client-tag-checkbox" type="checkbox" value="旅平卡" id="tag-travel"><label class="form-check-label" for="tag-travel">旅平卡</label></div><div class="form-check"><input class="form-check-input client-tag-checkbox" type="checkbox" value="產險" id="tag-property"><label class="form-check-label" for="tag-property">產險</label></div></div></div>
  <div class="mb-3"><div class="d-flex justify-content-between align-items-center mb-2"><label class="form-label small fw-bold mb-0">車輛資訊</label><button type="button" class="btn btn-outline-primary btn-sm py-0 px-2" onclick="addVehicleRow()"><i class="bi bi-plus"></i> 新增車輛</button></div><div id="vehicle-rows-container"></div></div>
</div><div class="modal-footer bg-light"><button type="button" class="btn btn-secondary btn-sm px-4" data-bs-dismiss="modal">取消</button><button type="button" class="btn btn-primary btn-sm px-4 fw-bold" id="save-client-btn" onclick="saveClient()">新增</button></div></div></div></div>
<div class="modal fade" id="interview-modal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-lg"><div class="modal-content rounded-4 border-0 shadow"><div class="modal-header bg-light"><h5 class="modal-title fw-bold" id="interview-modal-title"><i class="bi bi-journal-text"></i> 訪談紀錄</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><input type="hidden" id="current-interview-client-id"><input type="hidden" id="current-interview-id"><div class="card border-0 bg-light p-3 mb-4 rounded-3 shadow-sm"><h6 class="fw-bold text-primary mb-3" id="interview-form-title"><i class="bi bi-plus-circle"></i> 新增本次訪談紀錄</h6><div class="row g-3"><div class="col-md-6"><label class="form-label small fw-bold">訪談日期</label><input type="date" class="form-control" id="interview-date"></div><div class="col-md-6"><label class="form-label small fw-bold">訪談地點</label><input type="text" class="form-control" id="interview-location"></div><div class="col-12"><label class="form-label small fw-bold">訪談內容</label><textarea class="form-control" id="interview-content" rows="3"></textarea></div><div class="col-12 text-end"><button type="button" class="btn btn-secondary btn-sm px-3 me-2" id="cancel-interview-edit-btn" style="display:none" onclick="resetInterviewForm()">取消編輯</button><button type="button" class="btn btn-primary btn-sm px-4 fw-bold" id="save-interview-btn" onclick="saveInterview()">儲存訪談紀錄</button></div></div></div><h6 class="fw-bold mb-3 text-secondary"><i class="bi bi-clock-history"></i> 歷史訪談紀錄</h6><div id="interview-list"></div></div></div></div></div>
<div class="modal fade" id="note-modal" tabindex="-1"><div class="modal-dialog"><div class="modal-content rounded-4 border-0 shadow"><div class="modal-header bg-light"><h5 class="modal-title fw-bold" id="note-modal-title"><i class="bi bi-sticky"></i> 客戶備註</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><input type="hidden" id="current-note-client-id"><div class="mb-3"><textarea class="form-control" id="client-note-content" rows="5" placeholder="輸入備註內容..."></textarea></div></div><div class="modal-footer bg-light"><button type="button" class="btn btn-secondary btn-sm px-4" data-bs-dismiss="modal">取消</button><button type="button" class="btn btn-warning btn-sm px-4 fw-bold text-dark" id="save-note-btn" onclick="saveNote()">儲存備註</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxik28XYTitdvmd1XFjJxWu1aCzU7-bOSSjVNHBlmpu3kxYLWrMTgeoIPSjhc1ACtpz/exec';
let allClients=[],allInterviews=[],editingId=null,clientModal=null,interviewModal=null,noteModal=null;
let clientSaving=false,pendingClientId=null,pendingAddPayload=null,originalEditingBirthday='';
// V1.5.0：統計分析只使用已載入的既有資料，不修改 API 格式。
let activeMainTab='list',statsFilter=null;
let statsScroll=0,listScroll=0,statsDirty=true;
let analysisSelection=['all'];
const customerTags=['人壽','車險','旅平卡','產險'];
const $=id=>document.getElementById(id);
function escapeReminderHtml(value){return String(value==null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function safeJsArg(value){return JSON.stringify(String(value==null?'':value)).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/'/g,'\\u0027').replace(/"/g,'&quot;');}
function isExistingCustomer(c){return Array.isArray(c.tags)&&customerTags.some(t=>c.tags.includes(t));}
function getSourceType(c){return c.source&&c.source.type||'';}
function getAge(c){const date=parseReminderDate(c.birthday);if(!date)return null;const today=new Date();today.setHours(0,0,0,0);if(date>today)return null;return calculateBirthdayInfo(c.birthday).currentAge;}
function getAgeBand(age){return age===null?null:age>=90?'90+':Math.floor(age/10)*10+'–'+(Math.floor(age/10)*10+9);}
// V1.6.0：未填寫與數值 0 不混淆，收入級距採左含右不含。
function getAnnualIncome(c){const v=c&&c.annualIncome;if(v===''||v===null||v===undefined)return null;const n=Number(v);return Number.isFinite(n)&&n>=0?n:null;}
const incomeBands=[{label:'未滿40萬',min:0,max:40},{label:'40～59萬',min:40,max:60},{label:'60～79萬',min:60,max:80},{label:'80～99萬',min:80,max:100},{label:'100～149萬',min:100,max:150},{label:'150～199萬',min:150,max:200},{label:'200～299萬',min:200,max:300},{label:'300萬以上',min:300,max:Infinity}];
function getIncomeBand(c){const n=getAnnualIncome(c);if(n===null)return null;const b=incomeBands.find(b=>n>=b.min&&n<b.max);return b?b.label:null;}
function percent(n,total){return total?((n/total)*100).toFixed(1)+'%':'0.0%';}
function matchesAnalysis(c,selection){
  if(selection.includes('all'))return true;
  if(selection.includes('nonexisting'))return !isExistingCustomer(c);
  return Array.isArray(c.tags)&&selection.some(t=>c.tags.includes(t));
}
function analysisLabel(key){return key==='all'?'全部名單':key==='nonexisting'?'非既有客戶':key;}
function toggleAnalysis(key){
  if(key==='all'||key==='nonexisting')analysisSelection=[key];
  else{const next=analysisSelection.filter(t=>customerTags.includes(t));analysisSelection=next.includes(key)?next.filter(t=>t!==key):[...next,key];if(!analysisSelection.length)analysisSelection=['all'];}
  renderStatistics();
}
function applyStatsFilter(kind,value,label,global=false){

  container.innerHTML=clients.map(c=>{
    const info=calculateBirthdayInfo(c.birthday),interviews=allInterviews.filter(i=>i.clientId==c.id),phone=formatPhone(c.phone)||'未填寫',id=safeJsArg(c.id);
    const gender=c.gender==='男'?'<span class="badge ms-1" style="background:#e3f2fd;color:#0d6efd;border:1px solid #b6d4fe">男</span>':c.gender==='女'?'<span class="badge ms-1" style="background:#fce7f3;color:#d63384;border:1px solid #f8d7da">女</span>':'';
    const vehicles=Array.isArray(c.vehicles)&&c.vehicles.length?`<div class="mt-2 pt-2 border-top small text-secondary">${c.vehicles.map(v=>`<div class="d-flex align-items-center gap-2 mb-1"><span class="badge bg-warning text-dark border border-warning bg-opacity-25"><i class="bi ${v.type==='汽車'?'bi-car-front':v.type==='重機'?'bi-speedometer2':'bi-scooter'}"></i> ${escapeReminderHtml(v.type||'機車')}</span><span>車牌：<strong>${escapeReminderHtml(v.plate||'未填寫')}</strong></span><span class="text-muted ms-2"><i class="bi bi-shield-exclamation"></i> 強制險到期：${escapeReminderHtml(v.expiry||'未填寫')}</span></div>`).join('')}</div>`:'';
    const tags=Array.isArray(c.tags)&&c.tags.length?`<div class="d-flex flex-wrap gap-1 mt-2">${c.tags.map(t=>`<span class="badge bg-success bg-opacity-10 text-success border border-success px-2 py-1" style="font-size:.75rem"><i class="bi bi-tag-fill me-1"></i>${escapeReminderHtml(t)}</span>`).join('')}</div>`:'';
    const note=c.note&&String(c.note).trim()?`<button class="btn btn-sm btn-warning text-dark py-0 px-2 fw-bold shadow-sm" style="font-size:.75rem" onclick="openNoteModal(${id})"><i class="bi bi-sticky-fill"></i> 備註</button>`:`<button class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size:.75rem" onclick="openNoteModal(${id})"><i class="bi bi-sticky"></i> 備註</button>`;
    const occupation=c.occupation?`<div class="small text-secondary mb-1"><i class="bi bi-briefcase-fill me-1"></i> 職業：${escapeReminderHtml(c.occupation)}</div>`:'';
    const income=getAnnualIncome(c),incomeLine=income===null?'':`<div class="small mb-1"><span class="badge px-2 py-1" style="background:#e7f3ff;color:#175a9c;border:1px solid #b6d4fe;font-size:.78rem;white-space:normal;text-align:left"><i class="bi bi-cash-stack me-1"></i> 年收入：${escapeReminderHtml(income.toLocaleString('zh-TW',{maximumFractionDigits:10}))} 萬元</span></div>`;
    let source='';if(c.source&&c.source.type){const ref=c.source.type==='轉介紹'&&c.source.referrerName?`<button class="btn btn-sm btn-outline-primary py-0 px-1 ms-1 me-1" style="font-size:.75rem" onclick="jumpToClientByName(${safeJsArg(c.source.referrerName)})"><i class="bi bi-person-fill"></i> ${escapeReminderHtml(c.source.referrerName)}</button>`:'';source=`<div class="small text-secondary mb-1"><i class="bi bi-person-lines-fill me-1"></i> 來源：${escapeReminderHtml(c.source.type)} ${ref}${escapeReminderHtml(c.source.text||'')}</div>`;}
    return `<div class="card border-0 shadow-sm mb-3 rounded-4" id="client-card-${escapeReminderHtml(c.id)}"><div class="card-body p-3"><div class="d-flex justify-content-between align-items-center mb-2"><div class="d-flex align-items-center flex-wrap gap-1" style="flex-grow:1;min-width:0"><h5 class="fw-bold mb-0 text-dark d-flex align-items-center gap-1"><span>${escapeReminderHtml(c.name||'未命名')}</span>${gender}</h5><span class="fs-6 fw-normal text-muted">${info.currentAge}歲</span>${note}</div><div class="d-flex align-items-center gap-1 ms-2" style="flex-shrink:0"><button class="btn btn-sm btn-outline-secondary border-0 p-1" onclick="openModalForEdit(${id})" title="編輯"><i class="bi bi-pencil-fill"></i></button><button class="btn btn-sm btn-outline-danger border-0 p-1" onclick="deleteClient(${id})" title="刪除"><i class="bi bi-trash-fill"></i></button></div></div><div class="d-flex flex-wrap align-items-center gap-2 mb-2"><span class="badge bg-info text-dark bg-opacity-25 border border-info py-1 px-2" style="font-size:.75rem"><i class="bi bi-shield-plus"></i> 保險年齡${info.insuranceAge}歲 (再過${info.daysToInsuranceAgeInc}天+1)</span><span class="badge bg-secondary bg-opacity-10 text-secondary border py-1 px-2" style="cursor:pointer;font-size:.75rem" onclick="openInterviewModal(${id})" title="點擊進入訪談紀錄"><i class="bi bi-chat-left-text"></i> 訪談紀錄 (${interviews.length})</span></div>${source}<div class="small text-secondary mb-1"><i class="bi bi-calendar-event me-1"></i> 生日：${escapeReminderHtml(formatBirthdayWithRoc(c.birthday))} <span class="ms-3"><i class="bi bi-card-heading me-1"></i> 身分證：${escapeReminderHtml(c.idNumber||'未填寫')}</span></div>${occupation}${incomeLine}<div class="small text-secondary mb-1"><i class="bi bi-telephone-fill me-1"></i> 電話：<a href="tel:${escapeReminderHtml(phone)}" class="text-decoration-none">${escapeReminderHtml(phone)}</a></div><div class="small text-secondary mb-1"><i class="bi bi-geo-alt-fill me-1"></i> 地址：${escapeReminderHtml(c.address||'未填寫')}</div>${tags}${vehicles}</div></div>`;
  }).join('');
}
function openNoteModal(id){const c=allClients.find(c=>c.id==id);if(!c)return;$('current-note-client-id').value=id;$('note-modal-title').innerHTML='<i class="bi bi-sticky"></i> '+escapeReminderHtml(c.name)+' 的備註';$('client-note-content').value=c.note||'';noteModal.show();}
function saveNote(){const id=$('current-note-client-id').value,c=allClients.find(c=>c.id==id);if(!c)return;const btn=$('save-note-btn');btn.disabled=true;btn.innerText='儲存中...';const payload={action:'update',id:c.id,name:c.name,gender:c.gender,birthday:c.birthday,source:c.source||{},idNumber:c.idNumber,occupation:c.occupation,phone:c.phone,address:c.address,vehicles:c.vehicles,tags:c.tags||[],annualIncome:c.annualIncome===undefined?'':c.annualIncome,note:$('client-note-content').value};fetch(API_URL,{method:'POST',body:JSON.stringify(payload)}).then(r=>r.json()).then(res=>{btn.disabled=false;btn.innerText='儲存備註';if(res.status==='success'){noteModal.hide();loadData();}else alert('儲存失敗：'+res.message);}).catch(err=>{btn.disabled=false;btn.innerText='儲存備註';console.error(err);alert('發生錯誤，請檢查網路');});}
function addVehicleRow(type='機車',plate='',expiry=''){const container=$('vehicle-rows-container'),rowId='v-row-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),div=document.createElement('div');div.className='row g-2 align-items-center mb-2 vehicle-item-row bg-light p-2 rounded-3 border';div.id=rowId;div.innerHTML=`<div class="col-3"><select class="form-select form-select-sm vehicle-type"><option value="機車" ${type==='機車'?'selected':''}>機車</option><option value="重機" ${type==='重機'?'selected':''}>重機</option><option value="汽車" ${type==='汽車'?'selected':''}>汽車</option></select></div><div class="col-4"><input type="text" class="form-control form-control-sm vehicle-plate" placeholder="車牌號碼" value="${escapeReminderHtml(plate)}"></div><div class="col-4"><input type="${expiry?'date':'text'}" class="form-control form-control-sm vehicle-expiry" placeholder="強制險到期日" value="${escapeReminderHtml(expiry)}" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'"></div><div class="col-1 text-end"><button type="button" class="btn btn-sm text-danger p-0" onclick="this.closest('.vehicle-item-row').remove()"><i class="bi bi-trash-fill"></i></button></div>`;container.appendChild(div);}
function openInterviewModal(id){const c=allClients.find(c=>c.id==id);if(!c)return;$('current-interview-client-id').value=id;$('interview-modal-title').innerHTML='<i class="bi bi-journal-text"></i> '+escapeReminderHtml(c.name)+' 的訪談紀錄';resetInterviewForm();renderInterviewList(id);interviewModal.show();}
function resetInterviewForm(){$('current-interview-id').value='';$('interview-form-title').innerHTML='<i class="bi bi-plus-circle"></i> 新增本次訪談紀錄';$('save-interview-btn').innerText='儲存訪談紀錄';$('cancel-interview-edit-btn').style.display='none';const d=new Date();$('interview-date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');$('interview-location').value='';$('interview-content').value='';}
function editInterview(id){const item=allInterviews.find(i=>i.id==id);if(!item)return;$('current-interview-id').value=item.id;$('interview-form-title').innerHTML='<i class="bi bi-pencil-square"></i> 編輯訪談紀錄';$('save-interview-btn').innerText='更新訪談紀錄';$('cancel-interview-edit-btn').style.display='inline-block';$('interview-date').value=item.date||'';$('interview-location').value=item.location||'';$('interview-content').value=item.content||'';document.querySelector('#interview-modal .modal-body').scrollTo({top:0,behavior:'smooth'});}
function renderInterviewList(clientId){const container=$('interview-list'),items=allInterviews.filter(i=>i.clientId==clientId);if(!items.length){container.innerHTML='<div class="text-center text-muted py-3 small">目前尚無訪談紀錄，請利用上方表單新增。</div>';return;}items.sort((a,b)=>new Date(b.date)-new Date(a.date));container.innerHTML=items.map(item=>`<div class="card border mb-3 bg-white shadow-sm"><div class="card-body p-3"><div class="d-flex justify-content-between align-items-center mb-2"><div><span class="badge bg-primary bg-opacity-10 text-primary border border-primary me-2"><i class="bi bi-calendar3"></i> ${escapeReminderHtml(item.date||'未填寫日期')}</span><span class="badge bg-success bg-opacity-10 text-success border border-success"><i class="bi bi-geo-alt"></i> ${escapeReminderHtml(item.location||'未填寫地點')}</span></div><div><button class="btn btn-sm btn-outline-secondary border-0 me-1" onclick="editInterview(${safeJsArg(item.id)})" title="編輯訪談紀錄"><i class="bi bi-pencil-fill"></i></button><button class="btn btn-sm btn-outline-danger border-0" onclick="deleteInterview(${safeJsArg(item.id)},${safeJsArg(clientId)})" title="刪除訪談紀錄"><i class="bi bi-trash-fill"></i></button></div></div><div class="text-secondary mb-2" style="white-space:pre-wrap;font-size:.95rem;line-height:1.6">${escapeReminderHtml(item.content||'')}</div></div></div>`).join('');}
function saveInterview(){const clientId=$('current-interview-client-id').value,id=$('current-interview-id').value,date=$('interview-date').value,location=$('interview-location').value.trim(),content=$('interview-content').value.trim();if(!date||!content){alert('請填寫訪談日期與訪談內容！');return;}const btn=$('save-interview-btn');btn.disabled=true;btn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span> 處理中...';const payload={action:id?'updateInterview':'addInterview',id:id||undefined,clientId,date,location,content};fetch(API_URL,{method:'POST',body:JSON.stringify(payload)}).then(r=>r.json()).then(res=>{btn.disabled=false;btn.innerText=id?'更新訪談紀錄':'儲存訪談紀錄';if(res.status==='success'){loadDataForModal(clientId);resetInterviewForm();}else alert('儲存失敗：'+(res.message||'未知錯誤'));}).catch(err=>{btn.disabled=false;btn.innerText=id?'更新訪談紀錄':'儲存訪談紀錄';console.error(err);alert('發生錯誤，請檢查網路');});}
function loadDataForModal(id){fetch(API_URL).then(r=>r.json()).then(data=>{updateClientData(data);renderInterviewList(id);}).catch(err=>{console.error(err);alert('重新載入訪談紀錄失敗，請檢查網路');});}
function deleteInterview(id,clientId){if(!confirm('確定要刪除這則訪談紀錄嗎？'))return;fetch(API_URL,{method:'POST',body:JSON.stringify({action:'deleteInterview',id})}).then(r=>r.json()).then(res=>{if(res.status==='success')loadDataForModal(clientId);else alert('刪除失敗');}).catch(err=>{console.error(err);alert('發生錯誤');});}
function openModalForAdd(){if(clientSaving)return;if(pendingAddPayload){clientModal.show();return;}pendingClientId=null;editingId=null;originalEditingBirthday='';clearIdNumberError();$('modal-title').innerText='新增名單';$('save-client-btn').innerText='新增';$('client-id').value='';$('client-name').value='';$('client-gender').value='';setBirthdayPickerValue('');$('client-source-type').value='緣故';onSourceTypeChange();$('client-source-referrer').value='';$('client-source-text').value='';$('client-idNumber').value='';$('client-occupation').value='';$('client-annualIncome').value='';$('client-phone').value='';$('client-address').value='';document.querySelectorAll('.client-tag-checkbox').forEach(cb=>cb.checked=false);$('vehicle-rows-container').innerHTML='';clientModal.show();}
function openModalForEdit(id){if(clientSaving)return;if(pendingAddPayload){alert('上次新增尚未確認，請先開啟新增視窗重試。');return;}const c=allClients.find(c=>c.id==id);if(!c)return;editingId=id;originalEditingBirthday=c.birthday||'';clearIdNumberError();$('modal-title').innerText='編輯名單資料';$('save-client-btn').innerText='儲存';$('client-id').value=c.id;$('client-name').value=c.name||'';$('client-gender').value=c.gender||'';setBirthdayPickerValue(c.birthday||'');$('client-source-type').value=c.source&&c.source.type?c.source.type:'緣故';onSourceTypeChange();$('client-source-referrer').value=c.source&&c.source.type==='轉介紹'?c.source.referrerName||'':'';$('client-source-text').value=c.source&&c.source.text?c.source.text:'';$('client-idNumber').value=c.idNumber||'';$('client-occupation').value=c.occupation||'';$('client-annualIncome').value=getAnnualIncome(c)===null?'':String(getAnnualIncome(c));$('client-phone').value=formatPhone(c.phone);$('client-address').value=c.address||'';document.querySelectorAll('.client-tag-checkbox').forEach(cb=>cb.checked=!!(c.tags&&c.tags.includes(cb.value)));$('vehicle-rows-container').innerHTML='';if(Array.isArray(c.vehicles))c.vehicles.forEach(v=>addVehicleRow(v.type,v.plate,v.expiry));clientModal.show();}
function saveClient(){
  if(clientSaving)return;clearIdNumberError();const name=$('client-name').value.trim(),gender=$('client-gender').value;syncBirthdayValue();const birthday=$('client-birthday').value,sourceType=$('client-source-type').value,source={type:sourceType,referrerName:sourceType==='轉介紹'?$('client-source-referrer').value.trim():'',text:$('client-source-text').value.trim()};const idNumber=normalizeIdNumber($('client-idNumber').value);$('client-idNumber').value=idNumber;const occupation=$('client-occupation').value.trim(),phone=$('client-phone').value.trim(),address=$('client-address').value.trim(),tags=[...document.querySelectorAll('.client-tag-checkbox:checked')].map(cb=>cb.value),vehicles=[...document.querySelectorAll('.vehicle-item-row')].map(row=>({type:row.querySelector('.vehicle-type').value,plate:row.querySelector('.vehicle-plate').value.trim(),expiry:row.querySelector('.vehicle-expiry').value}));
  const incomeInput=$('client-annualIncome').value.trim(),annualIncome=incomeInput===''?'':Number(incomeInput);
  if(incomeInput!==''&&(!Number.isFinite(annualIncome)||annualIncome<0)){$('client-annualIncome').focus();alert('年收入請輸入大於或等於 0 的有效數字（單位：萬元）。');return;}
  if(!name||!gender||!birthday){alert('請填寫姓名、性別與生日！');return;}
  if(!isBirthdayNotFuture(birthday)){alert('出生日期不可晚於今天，請重新選擇生日。');return;}
  const unchanged=editingId!==null&&birthday===originalEditingBirthday;if(!pendingAddPayload&&!unchanged&&!isBirthdayWithinAgeLimit(birthday)){alert('生日超出允許範圍，客戶實際年齡最高為 99 歲，請重新選擇生日。');return;}
  const existing=allClients.find(c=>c.id===editingId),action=editingId?'update':'add',oldId=existing?normalizeIdNumber(existing.idNumber):'',validate=action==='add'||idNumber!==oldId;
  if(!pendingAddPayload&&validate&&idNumber){if(!/^[A-Z][12][0-9]{8}$/.test(idNumber)){showIdNumberError('身分證字號格式錯誤，請輸入一個英文字母及九個數字，第二碼須為 1 或 2。');return;}if(!isValidTaiwanIdNumber(idNumber)){showIdNumberError('身分證字號檢查碼錯誤，請重新確認。');return;}const duplicate=allClients.find(c=>String(c.id)!==String(editingId)&&normalizeIdNumber(c.idNumber)===idNumber);if(duplicate){showIdNumberError('此身分證字號已登錄於「'+(duplicate.name||'未命名客戶')+'」的客戶資料，請勿重複建檔。');return;}}
  if(action==='add'&&!pendingClientId)pendingClientId='C_'+(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));
  let payload={action,id:editingId||pendingClientId,name,gender,birthday,source,idNumber,occupation,annualIncome,phone,address,vehicles,tags,note:existing?existing.note||'':''};
  if(action==='add'){if(pendingAddPayload&&JSON.stringify(payload)!==JSON.stringify(pendingAddPayload))alert('上次新增結果尚未確認，將先重試原本資料。成功後可再編輯客戶。');if(!pendingAddPayload)pendingAddPayload=payload;payload=pendingAddPayload;}
  const btn=$('save-client-btn');clientSaving=true;btn.disabled=true;btn.innerText='儲存中...';function unlock(){clientSaving=false;btn.disabled=false;btn.innerText=action==='add'?'新增':'儲存';}
  fetch(API_URL,{method:'POST',body:JSON.stringify(payload)}).then(r=>r.json()).then(res=>{unlock();if(res.status==='success'){pendingClientId=null;pendingAddPayload=null;clientModal.hide();loadData();}else if(res.code==='INVALID_ID_NUMBER'||res.code==='DUPLICATE_ID_NUMBER'){if(action==='add'){pendingClientId=null;pendingAddPayload=null;}showIdNumberError(res.message||'身分證字號驗證失敗，請重新確認。');}else alert('儲存失敗：'+res.message);}).catch(err=>{unlock();console.error(err);alert('發生錯誤，請檢查網路或連線。若是新增，請在同一視窗重試，避免重複建檔。');});
}
function deleteClient(id){if(!confirm('確定要刪除這位客戶的資料與所有相關訪談紀錄嗎？'))return;fetch(API_URL,{method:'POST',body:JSON.stringify({action:'delete',id})}).then(r=>r.json()).then(res=>{if(res.status==='success')loadData();else alert('刪除失敗');}).catch(err=>{console.error(err);alert('刪除發生錯誤');});}
</script>
