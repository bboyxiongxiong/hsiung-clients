<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxik28XYTitdvmd1XFjJxWu1aCzU7-bOSSjVNHBlmpu3kxYLWrMTgeoIPSjhc1ACtpz/exec";
let allClients = [];
let allInterviews = [];
let editingId = null;
let clientModal = null;
let interviewModal = null;
let noteModal = null;

// V1.1：新增客戶防重複狀態
let clientSaving = false;
let pendingClientId = null;
let pendingAddPayload = null;

// V1.4.2：編輯既有客戶時，保留原始生日
let originalEditingBirthday = '';

document.addEventListener("DOMContentLoaded", () => {
  clientModal = new bootstrap.Modal(document.getElementById('client-modal'));
  interviewModal = new bootstrap.Modal(document.getElementById('interview-modal'));
  noteModal = new bootstrap.Modal(document.getElementById('note-modal'));

  // V1.1：儲存期間避免關閉表單
  document.getElementById('client-modal').addEventListener('hide.bs.modal', e => {
    if (clientSaving) e.preventDefault();
  });

  // V1.4.2：初始化生日年份及月份選項
  initializeBirthdayPicker();

  loadData();
});

// ========================================
// V1.4：民國與西元生日顯示
// ========================================

function formatBirthdayWithRoc(birthdayStr) {
  if (!birthdayStr) return '';

  const parts = String(birthdayStr).split('-');
  if (parts.length !== 3) return birthdayStr;

  const year = Number(parts[0]);
  if (!Number.isInteger(year) || year < 1) {
    return birthdayStr;
  }

  return '(' + (year - 1911) + ')' + birthdayStr;
}

// ========================================
// V1.4.2：取得生日允許的最早日期
// 已滿 100 歲不允許新增
// ========================================

function getMinimumBirthdayDate() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  // 先回推 100 年，再加一天
  // 例如 2026-11-18 -> 1926-11-19
  const minimumDate = new Date(
    today.getFullYear() - 100,
    today.getMonth(),
    today.getDate()
  );

  minimumDate.setDate(minimumDate.getDate() + 1);

  return minimumDate;
}

// ========================================
// V1.4.2：確認生日是否符合 99 足歲限制
// ========================================

function isBirthdayWithinAgeLimit(birthdayStr) {
  if (!birthdayStr) return false;

  const parts = String(birthdayStr).split('-');
  if (parts.length !== 3) return false;

  const year = Number(parts[0]);
  const month = Number(parts[1]);
  const day = Number(parts[2]);

  if (
    !Number.isInteger(year) ||
    !Number.isInteger(month) ||
    !Number.isInteger(day) ||
    year < 1912 ||
    month < 1 ||
    month > 12 ||
    day < 1 ||
    day > 31
  ) {
    return false;
  }

  const birthday = new Date(year, month - 1, day);

  if (
    birthday.getFullYear() !== year ||
    birthday.getMonth() !== month - 1 ||
    birthday.getDate() !== day
  ) {
    return false;
  }

  const minimumDate = getMinimumBirthdayDate();

  return birthday >= minimumDate;
}

// ========================================
// V1.4.2：初始化自訂生日選擇器
// 年份依今天自動更新
// 同時保留民國元年 1912 年的下限
// ========================================

function initializeBirthdayPicker() {
  const yearSelect = document.getElementById('birthday-year');
  const monthSelect = document.getElementById('birthday-month');

  yearSelect.innerHTML = '<option value="">年</option>';
  monthSelect.innerHTML = '<option value="">月</option>';

  const currentYear = new Date().getFullYear();
  const minimumYear = Math.max(
    1912,
    getMinimumBirthdayDate().getFullYear()
  );

  // 預留未來一年，維持 V1.4 原本行為
  for (let year = currentYear + 1; year >= minimumYear; year--) {
    const option = document.createElement('option');
    option.value = String(year);
    option.textContent = '(' + (year - 1911) + ')' + year + '年';
    yearSelect.appendChild(option);
  }

  updateBirthdayMonths();
}

// ========================================
// V1.4.2：依年份更新月份選項
// 排除整個月份都已超過 99 歲的情況
// ========================================

function updateBirthdayMonths() {
  const year = document.getElementById('birthday-year').value;
  const monthSelect = document.getElementById('birthday-month');
  const previousMonth = monthSelect.value;
  const minimumDate = getMinimumBirthdayDate();

  monthSelect.innerHTML = '<option value="">月</option>';

  if (!year) {
    updateBirthdayDays();
    return;
  }

  const selectedYear = Number(year);

  for (let month = 1; month <= 12; month++) {
    const lastDay = new Date(
      selectedYear,
      month,
      0
    ).getDate();

    const monthEndDate = new Date(
      selectedYear,
      month - 1,
      lastDay
    );

    // 既有客戶原始生日所在月份，允許保留
    const originalParts = originalEditingBirthday.split('-');
    const isOriginalMonth =
      editingId !== null &&
      originalParts.length === 3 &&
      Number(originalParts[0]) === selectedYear &&
      Number(originalParts[1]) === month;

    if (
      monthEndDate < minimumDate &&
      !isOriginalMonth
    ) {
      continue;
    }

    const option = document.createElement('option');
    option.value = String(month).padStart(2, '0');
    option.textContent = month + '月';
    monthSelect.appendChild(option);
  }

  if (
    previousMonth &&
    Array.from(monthSelect.options).some(
      option => option.value === previousMonth
    )
  ) {
    monthSelect.value = previousMonth;
  }

  updateBirthdayDays();
}

// ========================================
// V1.4.2：依年份及月份更新日期
// 精確限制已滿 100 歲的生日
// ========================================

function updateBirthdayDays() {
  const year = document.getElementById('birthday-year').value;
  const month = document.getElementById('birthday-month').value;
  const daySelect = document.getElementById('birthday-day');
  const previousDay = daySelect.value;

  daySelect.innerHTML = '<option value="">日</option>';

  if (!year || !month) {
    syncBirthdayValue();
    return;
  }

  const selectedYear = Number(year);
  const selectedMonth = Number(month);

  const lastDay = new Date(
    selectedYear,
    selectedMonth,
    0
  ).getDate();

  for (let day = 1; day <= lastDay; day++) {
    const birthdayStr =
      year + '-' +
      String(selectedMonth).padStart(2, '0') + '-' +
      String(day).padStart(2, '0');

    // 既有客戶原始生日可保留，不受新建年齡限制
    const isOriginalBirthday =
      editingId !== null &&
      birthdayStr === originalEditingBirthday;

    if (
      !isBirthdayWithinAgeLimit(birthdayStr) &&
      !isOriginalBirthday
    ) {
      continue;
    }

    const option = document.createElement('option');
    option.value = String(day).padStart(2, '0');
    option.textContent = day + '日';
    daySelect.appendChild(option);
  }

  if (
    previousDay &&
    Array.from(daySelect.options).some(
      option => option.value === previousDay
    )
  ) {
    daySelect.value = previousDay;
  }

  syncBirthdayValue();
}

// ========================================
// V1.4：同步選擇器與原本生日欄位
// ========================================

function syncBirthdayValue() {
  const year = document.getElementById('birthday-year').value;
  const month = document.getElementById('birthday-month').value;
  const day = document.getElementById('birthday-day').value;

  document.getElementById('client-birthday').value =
    year && month && day
      ? year + '-' + month + '-' + day
      : '';
}

// ========================================
// V1.4.2：新增或編輯時帶入生日
// 保護超出新限制的既有生日
// ========================================

function setBirthdayPickerValue(birthdayStr) {
  const yearSelect = document.getElementById('birthday-year');
  const monthSelect = document.getElementById('birthday-month');
  const daySelect = document.getElementById('birthday-day');

  // 每次開啟表單都重新計算當天的可選年份
  initializeBirthdayPicker();

  yearSelect.value = '';
  monthSelect.value = '';
  daySelect.value = '';

  if (!birthdayStr) {
    syncBirthdayValue();
    return;
  }

  const parts = String(birthdayStr).split('-');
  if (parts.length !== 3) {
    syncBirthdayValue();
    return;
  }

  const year = parts[0];
  const month = parts[1];
  const day = parts[2];

  // 既有客戶超出年份範圍時，加入原始年份
  if (!Array.from(yearSelect.options).some(option => option.value === year)) {
    const option = document.createElement('option');
    option.value = year;
    option.textContent = '(' + (Number(year) - 1911) + ')' + year + '年';
    yearSelect.appendChild(option);
  }

  yearSelect.value = year;

  // 依原始年份更新月份，並保留原始生日所在月份
  updateBirthdayMonths();

  if (
    Array.from(monthSelect.options).some(
      option => option.value === month
    )
  ) {
    monthSelect.value = month;
  }

  updateBirthdayDays();

  if (
    Array.from(daySelect.options).some(
      option => option.value === day
    )
  ) {
    daySelect.value = day;
  }

  syncBirthdayValue();
}

// V1.2：身分證字號標準化
// ========================================

function normalizeIdNumber(value) {
  if (value === null || value === undefined) {
    return '';
  }

  return String(value).trim().toUpperCase();
}

// ========================================
// V1.2：台灣身分證字號格式及檢查碼驗證
// ========================================

function isValidTaiwanIdNumber(value) {
  const idNumber = normalizeIdNumber(value);

  // 身分證字號維持非必填
  if (idNumber === '') {
    return true;
  }

  // 第一碼英文，第二碼 1 或 2，後面八碼數字
  if (!/^[A-Z][12][0-9]{8}$/.test(idNumber)) {
    return false;
  }

  const letterCodes = {
    A: 10,
    B: 11,
    C: 12,
    D: 13,
    E: 14,
    F: 15,
    G: 16,
    H: 17,
    I: 34,
    J: 18,
    K: 19,
    L: 20,
    M: 21,
    N: 22,
    O: 35,
    P: 23,
    Q: 24,
    R: 25,
    S: 26,
    T: 27,
    U: 28,
    V: 29,
    W: 32,
    X: 30,
    Y: 31,
    Z: 33
  };

  const letterCode = letterCodes[idNumber.charAt(0)];

  let sum =
    Math.floor(letterCode / 10) +
    (letterCode % 10) * 9;

  // 第二碼至第九碼依序乘上 8 至 1
  for (let i = 1; i <= 8; i++) {
    sum += Number(idNumber.charAt(i)) * (9 - i);
  }

  // 加上最後一碼檢查碼
  sum += Number(idNumber.charAt(9));

  return sum % 10 === 0;
}

// ========================================
// V1.3：保險年齡計算修正
// 剛好滿六個月不進位，超過六個月才進位
// 同步修正進位倒數、月底及閏年日期計算
// ========================================

function calculateBirthdayInfo(birthdayStr) {
  const emptyResult = {
    daysLeft: 0,
    currentAge: 0,
    insuranceAge: 0,
    daysToInsuranceAgeInc: 0
  };

  if (!birthdayStr) return emptyResult;

  const parts = birthdayStr.split('-');
  if (parts.length !== 3) return emptyResult;

  const birthYear = parseInt(parts[0], 10);
  const birthMonth = parseInt(parts[1], 10) - 1;
  const birthDay = parseInt(parts[2], 10);

  if (
    !Number.isInteger(birthYear) ||
    !Number.isInteger(birthMonth) ||
    !Number.isInteger(birthDay) ||
    birthMonth < 0 ||
    birthMonth > 11 ||
    birthDay < 1 ||
    birthDay > 31
  ) {
    return emptyResult;
  }

  const originalBirthday = new Date(
    birthYear,
    birthMonth,
    birthDay
  );

  if (
    originalBirthday.getFullYear() !== birthYear ||
    originalBirthday.getMonth() !== birthMonth ||
    originalBirthday.getDate() !== birthDay
  ) {
    return emptyResult;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const currentYear = today.getFullYear();

  // 取得指定年份的生日
  // 2 月 29 日遇非閏年，以 2 月最後一天計算
  function getBirthday(year) {
    const lastDay = new Date(
      year,
      birthMonth + 1,
      0
    ).getDate();

    return new Date(
      year,
      birthMonth,
      Math.min(birthDay, lastDay)
    );
  }

  // 加上六個日曆月
  // 若目標月份沒有相同日期，採該月最後一天
  function addSixMonths(date) {
    const targetYear = date.getFullYear();
    const targetMonth = date.getMonth() + 6;
    const targetDay = date.getDate();

    const lastDay = new Date(
      targetYear,
      targetMonth + 1,
      0
    ).getDate();

    return new Date(
      targetYear,
      targetMonth,
      Math.min(targetDay, lastDay)
    );
  }

  // 超過六個月：滿六個月的隔天才進位
  function getInsuranceIncreaseDate(birthday) {
    const date = addSixMonths(birthday);
    date.setDate(date.getDate() + 1);
    return date;
  }

  // 以日曆日期計算天數，避免日光節約時間影響
  function calendarDaysBetween(startDate, endDate) {
    const startUTC = Date.UTC(
      startDate.getFullYear(),
      startDate.getMonth(),
      startDate.getDate()
    );

    const endUTC = Date.UTC(
      endDate.getFullYear(),
      endDate.getMonth(),
      endDate.getDate()
    );

    return Math.round(
      (endUTC - startUTC) / 86400000
    );
  }

  // 計算實際足歲
  let currentAge = currentYear - birthYear;

  const birthdayThisYear = getBirthday(currentYear);

  if (today < birthdayThisYear) {
    currentAge -= 1;
  }

  // 計算下次生日倒數
  let nextBirthday = getBirthday(currentYear);

  if (nextBirthday < today) {
    nextBirthday = getBirthday(currentYear + 1);
  }

  const daysLeft = calendarDaysBetween(
    today,
    nextBirthday
  );

  // 最近一次生日
  let lastBirthday = getBirthday(currentYear);

  if (today < lastBirthday) {
    lastBirthday = getBirthday(currentYear - 1);
  }

  // 最近一次生日滿六個月後的隔天
  const increaseDate = getInsuranceIncreaseDate(
    lastBirthday
  );

  let insuranceAge = currentAge;

  if (today >= increaseDate) {
    insuranceAge = currentAge + 1;
  }

  // 下一次保險年齡進位日期
  let nextIncreaseDate = increaseDate;

  if (nextIncreaseDate <= today) {
    nextIncreaseDate = getInsuranceIncreaseDate(
      getBirthday(lastBirthday.getFullYear() + 1)
    );
  }

  const daysToInsuranceAgeInc = calendarDaysBetween(
    today,
    nextIncreaseDate
  );

  return {
    daysLeft,
    currentAge,
    insuranceAge,
    daysToInsuranceAgeInc
  };
}

function filterClients() {
  const keywordInput = document.getElementById('search-input');
  const keyword = keywordInput ? keywordInput.value.toLowerCase().trim() : '';
  const selectedFilter = document.getElementById('month-select').value;

  let sortMode = 'default';
  if (selectedFilter === 'sort-age-desc') sortMode = 'age-desc';
  if (selectedFilter === 'sort-ins-asc') sortMode = 'ins-asc';

  const filtered = allClients.filter(c => {
    const phoneFormatted = formatPhone(c.phone);

    let matchKeyword = true;
    if (keyword !== '') {
      const nameMatch = c.name && String(c.name).toLowerCase().includes(keyword);
      const phoneMatch = (c.phone && String(c.phone).toLowerCase().includes(keyword)) || phoneFormatted.includes(keyword);
      const addressMatch = c.address && String(c.address).toLowerCase().includes(keyword);
      const idMatch = c.idNumber && String(c.idNumber).toLowerCase().includes(keyword);
      const occMatch = c.occupation && String(c.occupation).toLowerCase().includes(keyword);
      const tagMatch = Array.isArray(c.tags) && c.tags.some(t => String(t).toLowerCase().includes(keyword));
      const vehicleMatch = Array.isArray(c.vehicles) && c.vehicles.some(v => v.plate && String(v.plate).toLowerCase().includes(keyword));
      const noteMatch = c.note && String(c.note).toLowerCase().includes(keyword);
      const sourceTypeMatch = c.source && c.source.type && String(c.source.type).toLowerCase().includes(keyword);
      const sourceRefMatch = c.source && c.source.referrerName && String(c.source.referrerName).toLowerCase().includes(keyword);
      const sourceTextMatch = c.source && c.source.text && String(c.source.text).toLowerCase().includes(keyword);

      matchKeyword = Boolean(nameMatch || phoneMatch || addressMatch || idMatch || occMatch || tagMatch || vehicleMatch || noteMatch || sourceTypeMatch || sourceRefMatch || sourceTextMatch);
    }

    let matchFilter = true;
    if (selectedFilter) {
      if (selectedFilter.startsWith('sort-')) {
        matchFilter = true;
      } else if (selectedFilter.startsWith('source-')) {
        const targetSource = selectedFilter.split('-')[1];
        matchFilter = Boolean(c.source && c.source.type === targetSource);
      } else if (selectedFilter.startsWith('gender-')) {
        const targetGender = selectedFilter.split('-')[1];
        matchFilter = Boolean(c.gender === targetGender);
      } else if (selectedFilter === 'type-life') {
        matchFilter = Boolean(Array.isArray(c.tags) && c.tags.includes('人壽'));
      } else if (selectedFilter === 'type-property') {
        matchFilter = Boolean(Array.isArray(c.tags) && (c.tags.includes('車險') || c.tags.includes('旅平卡') || c.tags.includes('產險')));
      } else if (selectedFilter.startsWith('ins-')) {
        const targetMonth = selectedFilter.split('-')[1];
        matchFilter = false;
        if (Array.isArray(c.vehicles) && c.vehicles.length > 0) {
          matchFilter = c.vehicles.some(v => {
            if (!v.expiry) return false;
            const parts = String(v.expiry).split('-');
            if (parts.length === 3) {
              return parts[1] === targetMonth;
            }
            return false;
          });
        }
      } else {
        if (c.birthday) {
          const parts = String(c.birthday).split('-');
          if (parts.length === 3) {
            matchFilter = (parts[1] === selectedFilter);
          } else {
            matchFilter = false;
          }
        } else {
          matchFilter = false;
        }
      }
    }
    return matchKeyword && matchFilter;
  });

  renderClients(filtered, sortMode);
}

function jumpToClientByName(name) {
  const target = allClients.find(c => c.name === name);
  if (!target) {
    alert(`找不到名單：「${name}」`);
    return;
  }
  document.getElementById('search-input').value = name;
  filterClients();

  setTimeout(() => {
    const cardEl = document.getElementById(`client-card-${target.id}`);
    if (cardEl) {
      cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      cardEl.classList.add('border', 'border-primary', 'shadow');
      setTimeout(() => {
        cardEl.classList.remove('border', 'border-primary', 'shadow');
      }, 2000);
    }
  }, 100);
}

function renderClients(clients, sortMode = 'default') {
  const container = document.getElementById('client-list');
  document.getElementById('client-count').innerText = `${clients.length} 名單`;

  if (clients.length === 0) {
    container.innerHTML = '<div class="text-center py-5 text-muted">符合條件的客戶資料</div>';
    return;
  }

  if (sortMode === 'age-desc') {
    clients.sort((a, b) => {
      return calculateBirthdayInfo(b.birthday).currentAge - calculateBirthdayInfo(a.birthday).currentAge;
    });
  } else if (sortMode === 'ins-asc') {
    clients.sort((a, b) => {
      return calculateBirthdayInfo(a.birthday).daysToInsuranceAgeInc - calculateBirthdayInfo(b.birthday).daysToInsuranceAgeInc;
    });
  } else {
    clients.sort((a, b) => {
      return calculateBirthdayInfo(a.birthday).daysLeft - calculateBirthdayInfo(b.birthday).daysLeft;
    });
  }

  let html = '';
  clients.forEach(c => {
    const info = calculateBirthdayInfo(c.birthday);
    const clientInterviews = allInterviews.filter(i => i.clientId == c.id);
    const phoneStr = formatPhone(c.phone) || '未填寫';

    let genderBadge = '';
    if (c.gender === '男') {
      genderBadge = `<span class="badge ms-1" style="background-color: #e3f2fd; color: #0d6efd; border: 1px solid #b6d4fe;">男</span>`;
    } else if (c.gender === '女') {
      genderBadge = `<span class="badge ms-1" style="background-color: #fce7f3; color: #d63384; border: 1px solid #f8d7da;">女</span>`;
    }

    let vehiclesHtml = '';
    if (c.vehicles && c.vehicles.length > 0) {
      vehiclesHtml = `<div class="mt-2 pt-2 border-top small text-secondary">`;
      c.vehicles.forEach(v => {
        let typeIcon = 'bi-scooter';
        if (v.type === '汽車') {
          typeIcon = 'bi-car-front';
        } else if (v.type === '重機') {
          typeIcon = 'bi-speedometer2';
        }
        vehiclesHtml += `
          <div class="d-flex align-items-center gap-2 mb-1">
            <span class="badge bg-warning text-dark border border-warning bg-opacity-25">
              <i class="bi ${typeIcon}"></i> ${v.type || '機車'}
            </span>
            <span>車牌：<strong>${v.plate || '未填寫'}</strong></span>
            <span class="text-muted ms-2"><i class="bi bi-shield-exclamation"></i> 強制險到期：${v.expiry || '未填寫'}</span>
          </div>
        `;
      });
      vehiclesHtml += `</div>`;
    }

    let tagsHtml = '';
    if (c.tags && c.tags.length > 0) {
      tagsHtml = `<div class="d-flex flex-wrap gap-1 mt-2">`;
      c.tags.forEach(t => {
        tagsHtml += `<span class="badge bg-success bg-opacity-10 text-success border border-success px-2 py-1" style="font-size: 0.75rem;"><i class="bi bi-tag-fill me-1"></i>${t}</span>`;
      });
      tagsHtml += `</div>`;
    }

    let noteBtnHtml = '';
    if (c.note && c.note.trim() !== '') {
      noteBtnHtml = `<button class="btn btn-sm btn-warning text-dark py-0 px-2 fw-bold shadow-sm" style="font-size: 0.75rem;" onclick="openNoteModal('${c.id}')"><i class="bi bi-sticky-fill"></i> 備註</button>`;
    } else {
      noteBtnHtml = `<button class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size: 0.75rem;" onclick="openNoteModal('${c.id}')"><i class="bi bi-sticky"></i> 備註</button>`;
    }

    let occupationHtml = c.occupation ? `<span class="me-3"><i class="bi bi-briefcase-fill me-1"></i> 職業：${c.occupation}</span>` : '';

    let sourceHtml = '';
    if (c.source && c.source.type) {
      let referrerBtn = '';
      if (c.source.type === '轉介紹' && c.source.referrerName) {
        referrerBtn = `<button class="btn btn-sm btn-outline-primary py-0 px-1 ms-1 me-1" style="font-size: 0.75rem;" onclick="jumpToClientByName('${c.source.referrerName}')"><i class="bi bi-person-fill"></i> ${c.source.referrerName}</button>`;
      }
      sourceHtml = `
        <div class="small text-secondary mb-1">
          <i class="bi bi-person-lines-fill me-1"></i> 來源：${c.source.type} ${referrerBtn}${c.source.text || ''}
        </div>
      `;
    }

    html += `
      <div class="card border-0 shadow-sm mb-3 rounded-4" id="client-card-${c.id}">
        <div class="card-body p-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="d-flex align-items-center flex-wrap gap-1" style="flex-grow: 1; min-width: 0;">
              <h5 class="fw-bold mb-0 text-dark d-flex align-items-center gap-1">
                <span>${c.name || '未命名'}</span>

              <i class="bi bi-chat-left-text"></i> 訪談紀錄 (${clientInterviews.length})
            </span>
          </div>
          ${sourceHtml}
          <div class="small text-secondary mb-1">
            <i class="bi bi-calendar-event me-1"></i> 生日：${formatBirthdayWithRoc(c.birthday)} <span class="ms-3"><i class="bi bi-card-heading me-1"></i> 身分證：${c.idNumber || '未填寫'}</span>
          </div>
          <div class="small text-secondary mb-1">
            ${occupationHtml}
            <i class="bi bi-telephone-fill me-1"></i> 電話：<a href="tel:${phoneStr}" class="text-decoration-none">${phoneStr}</a>
          </div>
          <div class="small text-secondary mb-1">

function openNoteModal(clientId) {
  const client = allClients.find(c => c.id == clientId);
  if (!client) return;

  document.getElementById('current-note-client-id').value = clientId;
  document.getElementById('note-modal-title').innerHTML = `<i class="bi bi-sticky"></i> ${client.name} 的備註`;

  const textarea = document.getElementById('client-note-content');
  textarea.value = client.note || '';

  noteModal.show();
}

function saveNote() {
  const clientId = document.getElementById('current-note-client-id').value;
  const client = allClients.find(c => c.id == clientId);
  if (!client) return;

  const noteContent = document.getElementById('client-note-content').value;

  const saveBtn = document.getElementById('save-note-btn');
  saveBtn.disabled = true;
  saveBtn.innerText = '儲存中...';

  const payload = {
    action: 'update',
    id: client.id,
    name: client.name,
    gender: client.gender,
    birthday: client.birthday,
    source: client.source || {},
    idNumber: client.idNumber,
    occupation: client.occupation,
    phone: client.phone,
    address: client.address,
    vehicles: client.vehicles,
    tags: client.tags || [],
    note: noteContent
  };

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(res => {
    saveBtn.disabled = false;
    saveBtn.innerText = '儲存備註';
    if (res.status === 'success') {
      noteModal.hide();
      loadData();
    } else {
      alert('儲存失敗：' + res.message);
    }
  })
  .catch(err => {
    saveBtn.disabled = false;
    saveBtn.innerText = '儲存備註';
    console.error(err);
    alert('發生錯誤，請檢查網路');
  });
}

function addVehicleRow(type = '機車', plate = '', expiry = '') {
  const container = document.getElementById('vehicle-rows-container');
  const rowId = 'v-row-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);

  const div = document.createElement('div');
  div.className = 'row g-2 align-items-center mb-2 vehicle-item-row bg-light p-2 rounded-3 border';
  div.id = rowId;

  const expiryInputType = expiry ? 'date' : 'text';

  div.innerHTML = `
    <div class="col-3">
      <select class="form-select form-select-sm vehicle-type">
        <option value="機車" ${type === '機車' ? 'selected' : ''}>機車</option>
        <option value="重機" ${type === '重機' ? 'selected' : ''}>重機</option>
        <option value="汽車" ${type === '汽車' ? 'selected' : ''}>汽車</option>
      </select>
    </div>
    <div class="col-4">
      <input type="text" class="form-control form-control-sm vehicle-plate" placeholder="車牌號碼" value="${plate}">
    </div>
    <div class="col-4">
      <input type="${expiryInputType}" class="form-control form-control-sm vehicle-expiry" placeholder="強制險到期日" value="${expiry}" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'">
    </div>
    <div class="col-1 text-end">
      <button type="button" class="btn btn-sm text-danger p-0" onclick="document.getElementById('${rowId}').remove()"><i class="bi bi-trash-fill"></i></button>
    </div>
  `;
  container.appendChild(div);
}

function openInterviewModal(clientId) {
  const client = allClients.find(c => c.id == clientId);
  if (!client) return;

  document.getElementById('current-interview-client-id').value = clientId;
  document.getElementById('interview-modal-title').innerHTML = `<i class="bi bi-journal-text"></i> ${client.name} 的訪談紀錄`;

  resetInterviewForm();
  renderInterviewList(clientId);
  interviewModal.show();
}

function resetInterviewForm() {
  document.getElementById('current-interview-id').value = '';
  document.getElementById('interview-form-title').innerHTML = `<i class="bi bi-plus-circle"></i> 新增本次訪談紀錄`;
  document.getElementById('save-interview-btn').innerText = '儲存訪談紀錄';
  document.getElementById('cancel-interview-edit-btn').style.display = 'none';

  document.getElementById('interview-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('interview-location').value = '';
  document.getElementById('interview-content').value = '';
}

function editInterview(interviewId) {
  const item = allInterviews.find(i => i.id == interviewId);
  if (!item) return;

  document.getElementById('current-interview-id').value = item.id;
  document.getElementById('interview-form-title').innerHTML = `<i class="bi bi-pencil-square"></i> 編輯訪談紀錄`;
  document.getElementById('save-interview-btn').innerText = '更新訪談紀錄';
  document.getElementById('cancel-interview-edit-btn').style.display = 'inline-block';

  document.getElementById('interview-date').value = item.date || '';
  document.getElementById('interview-location').value = item.location || '';
  document.getElementById('interview-content').value = item.content || '';

  document.querySelector('#interview-modal .modal-body').scrollTo({ top: 0, behavior: 'smooth' });
}

function renderInterviewList(clientId) {
  const container = document.getElementById('interview-list');
  const clientInterviews = allInterviews.filter(i => i.clientId == clientId);

  if (clientInterviews.length === 0) {
    container.innerHTML = '<div class="text-center text-muted py-3 small">目前尚無訪談紀錄，請利用上方表單新增。</div>';
    return;
  }

  clientInterviews.sort((a, b) => new Date(b.date) - new Date(a.date));

  let html = '';
  clientInterviews.forEach(item => {
    html += `
      <div class="card border mb-3 bg-white shadow-sm">
        <div class="card-body p-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
              <span class="badge bg-primary bg-opacity-10 text-primary border border-primary me-2">
                <i class="bi bi-calendar3"></i> ${item.date || '未填寫日期'}
              </span>
              <span class="badge bg-success bg-opacity-10 text-success border border-success">
                <i class="bi bi-geo-alt"></i> ${item.location || '未填寫地點'}
              </span>
            </div>
            <div>
              <button class="btn btn-sm btn-outline-secondary border-0 me-1" onclick="editInterview('${item.id}')" title="編輯訪談紀錄"><i class="bi bi-pencil-fill"></i></button>
              <button class="btn btn-sm btn-outline-danger border-0" onclick="deleteInterview('${item.id}', '${clientId}')" title="刪除訪談紀錄"><i class="bi bi-trash-fill"></i></button>
            </div>
          </div>
          <div class="text-secondary mb-2" style="white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6;">${item.content || ''}</div>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function saveInterview() {
  const clientId = document.getElementById('current-interview-client-id').value;
  const interviewId = document.getElementById('current-interview-id').value;
  const date = document.getElementById('interview-date').value;
  const location = document.getElementById('interview-location').value.trim();
  const content = document.getElementById('interview-content').value.trim();

  if (!date || !content) {
    alert('請填寫訪談日期與訪談內容！');
    return;
  }

  const saveBtn = document.getElementById('save-interview-btn');
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> 處理中...';

  const actionType = interviewId ? 'updateInterview' : 'addInterview';
  const payload = {
    action: actionType,
    id: interviewId || undefined,
    clientId: clientId,
    date: date,
    location: location,
    content: content
  };

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(res => {
    saveBtn.disabled = false;
    saveBtn.innerText = interviewId ? '更新訪談紀錄' : '儲存訪談紀錄';
    if (res.status === 'success') {
      loadDataForModal(clientId);
      resetInterviewForm();
    } else {
      alert('儲存失敗：' + (res.message || '未知錯誤'));
    }
  })
  .catch(err => {
    saveBtn.disabled = false;
    saveBtn.innerText = interviewId ? '更新訪談紀錄' : '儲存訪談紀錄';
    console.error(err);
    alert('發生錯誤，請檢查網路');
  });
}

function loadDataForModal(clientId) {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      allClients = data.clients || [];
      allInterviews = data.interviews || [];
      checkTodayBirthdays();
      filterClients();
      renderInterviewList(clientId);
    });
}

function deleteInterview(id, clientId) {
  if (!confirm('確定要刪除這則訪談紀錄嗎？')) return;

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'deleteInterview', id: id })
  })
  .then(res => res.json())
  .then(res => {
    if (res.status === 'success') {
      loadDataForModal(clientId);
    } else {
      alert('刪除失敗');
    }
  })
  .catch(err => {
    console.error(err);
    alert('發生錯誤');
  });
}

function openModalForAdd() {
  // V1.1：防止儲存期間重新開啟新增表單
  if (clientSaving) return;

  // 上次新增結果尚未確認時，保留原表單
  if (pendingAddPayload) {
    clientModal.show();
    return;
  }

  pendingClientId = null;
  editingId = null;

  // V1.4.2：新增模式沒有既有生日例外
  originalEditingBirthday = '';

  // V1.2：清除上次身分證字號錯誤提示
  clearIdNumberError();

  document.getElementById('modal-title').innerText = '新增名單';
  document.getElementById('save-client-btn').innerText = '新增';
  document.getElementById('client-id').value = '';
  document.getElementById('client-name').value = '';
  document.getElementById('client-gender').value = '';

  // V1.4.2：清空生日選擇器並更新可選日期
  setBirthdayPickerValue('');

  document.getElementById('client-source-type').value = '緣故';
  onSourceTypeChange();
  document.getElementById('client-source-referrer').value = '';
  document.getElementById('client-source-text').value = '';
  document.getElementById('client-idNumber').value = '';
  document.getElementById('client-occupation').value = '';
  document.getElementById('client-phone').value = '';
  document.getElementById('client-address').value = '';

  document.querySelectorAll('.client-tag-checkbox').forEach(cb => cb.checked = false);

  document.getElementById('vehicle-rows-container').innerHTML = '';
  clientModal.show();
}

function openModalForEdit(id) {
  // V1.1：避免尚未完成的新增操作被覆蓋
  if (clientSaving) return;

  if (pendingAddPayload) {
    alert('上次新增尚未確認，請先開啟新增視窗重試。');
    return;
  }

  const client = allClients.find(c => c.id == id);
  if (!client) return;

  editingId = id;

  // V1.4.2：記錄既有生日，避免年齡限制阻止編輯其他欄位
  originalEditingBirthday = client.birthday || '';

  // V1.2：清除上次身分證字號錯誤提示
  clearIdNumberError();

  document.getElementById('modal-title').innerText = '編輯名單資料';
  document.getElementById('save-client-btn').innerText = '儲存';
  document.getElementById('client-id').value = client.id;
  document.getElementById('client-name').value = client.name || '';
  document.getElementById('client-gender').value = client.gender || '';

  // V1.4.2：帶入既有生日，必要時保留超出範圍的選項
  setBirthdayPickerValue(client.birthday || '');

  document.getElementById('client-source-type').value = client.source && client.source.type ? client.source.type : '緣故';
  onSourceTypeChange();
  if (client.source && client.source.type === '轉介紹') {
    document.getElementById('client-source-referrer').value = client.source.referrerName || '';
  } else {
    document.getElementById('client-source-referrer').value = '';
  }
  document.getElementById('client-source-text').value = client.source && client.source.text ? client.source.text : '';

  document.getElementById('client-idNumber').value = client.idNumber || '';
  document.getElementById('client-occupation').value = client.occupation || '';
  document.getElementById('client-phone').value = formatPhone(client.phone);
  document.getElementById('client-address').value = client.address || '';

  document.querySelectorAll('.client-tag-checkbox').forEach(cb => {
    cb.checked = client.tags && client.tags.includes(cb.value);
  });

  const vehicleContainer = document.getElementById('vehicle-rows-container');
  vehicleContainer.innerHTML = '';
  if (client.vehicles && client.vehicles.length > 0) {
    client.vehicles.forEach(v => {
      addVehicleRow(v.type, v.plate, v.expiry);
    });
  }

  clientModal.show();
}

function saveClient() {
  // V1.1：防止連續點擊造成重複請求
  if (clientSaving) return;

  // V1.2：清除上次錯誤提示
  clearIdNumberError();

  const name = document.getElementById('client-name').value.trim();
  const gender = document.getElementById('client-gender').value;

  // V1.4：將自訂生日選擇器轉為 YYYY-MM-DD
  syncBirthdayValue();
  const birthday = document.getElementById('client-birthday').value;

  const sourceType = document.getElementById('client-source-type').value;
  const sourceReferrer = document.getElementById('client-source-referrer').value.trim();
  const sourceText = document.getElementById('client-source-text').value.trim();
  const source = {
    type: sourceType,
    referrerName: sourceType === '轉介紹' ? sourceReferrer : '',
    text: sourceText
  };

  // V1.2：自動去除前後空白並轉成大寫
  const idNumber = normalizeIdNumber(
    document.getElementById('client-idNumber').value
  );

  document.getElementById('client-idNumber').value = idNumber;

  const occupation = document.getElementById('client-occupation').value.trim();
  const phone = document.getElementById('client-phone').value.trim();
  const address = document.getElementById('client-address').value.trim();

  const tags = [];
  document.querySelectorAll('.client-tag-checkbox:checked').forEach(cb => {
    tags.push(cb.value);
  });

  const vehicles = [];
  const vehicleRows = document.querySelectorAll('.vehicle-item-row');
  vehicleRows.forEach(row => {
    const type = row.querySelector('.vehicle-type').value;
    const plate = row.querySelector('.vehicle-plate').value.trim();
    const expiry = row.querySelector('.vehicle-expiry').value;
    vehicles.push({ type, plate, expiry });
  });

  if (!name || !birthday) {
    alert('請填寫姓名與生日！');
    return;
  }

  // ========================================
  // V1.4.2：生日最高 99 足歲驗證
  // 既有客戶原始生日不變時允許儲存
  // ========================================

  const isUnchangedExistingBirthday =
    editingId !== null &&
    birthday === originalEditingBirthday;

  // 待重試的新增請求仍使用 V1.1 原始資料
  if (
    !pendingAddPayload &&
    !isUnchangedExistingBirthday &&
    !isBirthdayWithinAgeLimit(birthday)
  ) {
    alert('生日超出允許範圍，客戶實際年齡最高為 99 歲，請重新選擇生日。');
    return;
  }

  const existingClient = allClients.find(c => c.id === editingId);
  const currentNote = existingClient ? existingClient.note || '' : '';

  const action = editingId ? 'update' : 'add';

  // ========================================
  // V1.2：身分證字號前端驗證
  // ========================================

  const oldIdNumber = existingClient
    ? normalizeIdNumber(existingClient.idNumber)
    : '';

  const shouldValidateId =
    action === 'add' ||
    idNumber !== oldIdNumber;

  // 尚未確認的新增請求必須沿用原始資料重試
  // 避免前端重複檢查阻止 V1.1 的重試機制
  if (
    !pendingAddPayload &&
    shouldValidateId &&
    idNumber !== ''
  ) {

    // 檢查身分證字號格式
    if (!/^[A-Z][12][0-9]{8}$/.test(idNumber)) {
      showIdNumberError(
        '身分證字號格式錯誤，請輸入一個英文字母及九個數字，第二碼須為 1 或 2。'
      );
      return;
    }

    // 檢查身分證字號檢查碼
    if (!isValidTaiwanIdNumber(idNumber)) {
      showIdNumberError(
        '身分證字號檢查碼錯誤，請重新確認。'
      );
      return;
    }

    // 檢查其他客戶是否使用相同身分證字號
    const duplicateClient = allClients.find(c => {
      if (String(c.id) === String(editingId)) {
        return false;
      }

      const existingIdNumber = normalizeIdNumber(c.idNumber);

      return (
        existingIdNumber !== '' &&
        existingIdNumber === idNumber
      );
    });

    if (duplicateClient) {
      showIdNumberError(
        '此身分證字號已登錄於「' +
        (duplicateClient.name || '未命名客戶') +
        '」的客戶資料，請勿重複建檔。'
      );
      return;
    }
  }

  // V1.1：同一次新增及重試沿用相同客戶 ID
  if (action === 'add' && !pendingClientId) {
    pendingClientId = 'C_' + (
      typeof crypto !== 'undefined' &&
      typeof crypto.randomUUID === 'function'
        ? crypto.randomUUID()
        : Date.now() + '_' +
          Math.random().toString(36).slice(2) +
          Math.random().toString(36).slice(2)
    );
  }

  let payload = {
    action: action,
    id: editingId || pendingClientId,
    name: name,
    gender: gender,
    birthday: birthday,
    source: source,
    idNumber: idNumber,
    occupation: occupation,
    phone: phone,
    address: address,
    vehicles: vehicles,
    tags: tags,
    note: currentNote
  };

  // V1.1：網路失敗時保留原始新增請求
  if (action === 'add') {
    if (
      pendingAddPayload &&
      JSON.stringify(payload) !== JSON.stringify(pendingAddPayload)
    ) {
      alert('上次新增結果尚未確認，將先重試原本資料。成功後可再編輯客戶。');
    }

    if (!pendingAddPayload) {
      pendingAddPayload = payload;
    }

    payload = pendingAddPayload;
  }

  // V1.1：鎖定儲存按鈕
  const saveBtn = document.getElementById('save-client-btn');
  clientSaving = true;
  saveBtn.disabled = true;
  saveBtn.innerText = '儲存中...';

  // V1.1：恢復儲存按鈕
  function unlockClientSave() {
    clientSaving = false;
    saveBtn.disabled = false;
    saveBtn.innerText = action === 'add' ? '新增' : '儲存';
  }

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(res => {
    unlockClientSave();

    if (res.status === 'success') {
      // V1.1：確認成功後才清除本次新增狀態
      pendingClientId = null;
      pendingAddPayload = null;

      clientModal.hide();
      loadData();

    } else {

      // V1.2：處理後端身分證字號驗證錯誤
      if (
        res.code === 'INVALID_ID_NUMBER' ||
        res.code === 'DUPLICATE_ID_NUMBER'
      ) {

        // 後端已確認拒絕此次寫入
        // 解除待重試狀態，允許使用者修正資料
        if (action === 'add') {
          pendingClientId = null;
          pendingAddPayload = null;
        }

        showIdNumberError(
          res.message || '身分證字號驗證失敗，請重新確認。'
        );

      } else {
        alert('儲存失敗：' + res.message);
      }
    }
  })
  .catch(err => {
    unlockClientSave();
    console.error(err);
    alert('發生錯誤，請檢查網路或連線。若是新增，請在同一視窗重試，避免重複建檔。');
  });
}

function deleteClient(id) {
  if (!confirm('確定要刪除這位客戶的資料與所有相關訪談紀錄嗎？')) return;

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'delete', id: id })
  })
  .then(res => res.json())
  .then(res => {
    if (res.status === 'success') {
      loadData();
    } else {
      alert('刪除失敗');
    }
  })
  .catch(err => {
    console.error(err);
    alert('刪除發生錯誤');
  });
}

// V1.4：日期變更後同步原本的生日欄位
document.getElementById('birthday-day').addEventListener('change', syncBirthdayValue);

</script>
</body>
</html>
